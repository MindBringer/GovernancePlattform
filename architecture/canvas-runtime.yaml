  "validations": [
    {
      "key": "RequiredField",
      "objectTypeKey": "*",
      "fieldInternalName": "",
      "ruleType": "Required",
      "expression": "IsRequired && IsBlank(Value)",
      "messageDE": "Bitte füllen Sie dieses Pflichtfeld aus.",
      "severity": "Error",
      "sortOrder": 10,
      "enabled": true
    },
    {
      "key": "ReviewDateFuture",
      "objectTypeKey": "*",
      "fieldInternalName": "NextReviewDate",
      "ruleType": "Expression",
      "expression": "IsBlank(Value) || Value >= Today()",
      "messageDE": "Das nächste Review darf nicht in der Vergangenheit liegen.",
      "severity": "Warning",
      "sortOrder": 20,
      "enabled": true
    },
    {
      "key": "DateRange",
      "objectTypeKey": "*",
      "fieldInternalName": "ValidUntil",
      "ruleType": "Expression",
      "expression": "IsBlank(Value) || IsBlank(ValidFrom) || Value >= ValidFrom",
      "messageDE": "Gültig bis muss nach Gültig ab liegen.",
      "severity": "Error",
      "sortOrder": 30,
      "enabled": true
    }
  ],
  "businessRules": [
    {
      "key": "GovernanceIdReadOnly",
      "objectTypeKey": "*",
      "trigger": "OnLoad",
      "condition": "!IsBlank(GovernanceID)",
      "actionType": "SetReadOnly",
      "targetField": "GovernanceID",
      "parametersJson": "{}",
      "priority": 10,
      "enabled": true
    },
    {
      "key": "CalculateNextReview",
      "objectTypeKey": "*",
      "trigger": "OnSave",
      "condition": "!IsBlank(ReviewCycleMonths)",
      "actionType": "SetValue",
      "targetField": "NextReviewDate",
      "parametersJson": "{\"formula\":\"DateAdd(Coalesce(LastReviewDate,Today()),ReviewCycleMonths,TimeUnit.Months)\"}",
      "priority": 20,
      "enabled": true
    },
    {
      "key": "ApprovalFields",
      "objectTypeKey": "Change",
      "trigger": "OnChange",
      "condition": "ApprovalStatus = \"Genehmigt\"",
      "actionType": "RequireFields",
      "targetField": "Approver;ApprovedDate",
      "parametersJson": "{}",
      "priority": 30,
      "enabled": true
    }
  ],
