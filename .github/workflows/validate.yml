name: Validate repository
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Canvas YAML validator and run regression checks
        run: |
          python3 -m pip install -r tools/companion/requirements-validation.txt
          python3 -m unittest discover -s tools/companion -p test_verify_canvas_yaml.py
          python3 -m unittest discover -s tools/companion -p test_verify_canvas_write_contract.py
      - name: PowerShell syntax and repository checks
        shell: pwsh
        run: |
          git diff --check HEAD~1 HEAD 2>/dev/null || git diff --check
          Get-ChildItem powerplatform/scripts -Filter *.ps1 -Recurse | ForEach-Object { [void][scriptblock]::Create((Get-Content $_.FullName -Raw)) }
      - name: Validate Canvas version and source
        shell: pwsh
        run: ./powerplatform/scripts/Validate-CanvasSource.ps1
      - name: Validate Asset editor accessibility contract
        shell: pwsh
        run: ./powerplatform/scripts/Test-AssetEditorAccessibility.ps1
      - name: Validate object provider registry
        shell: pwsh
        run: ./powerplatform/scripts/Validate-ObjectProviderRegistry.ps1
      - name: Check generated provider runtime
        shell: pwsh
        run: ./powerplatform/scripts/Sync-ObjectProviderRuntime.ps1 -CheckOnly
      - name: Verify packed Canvas source
        run: python3 tools/companion/verify_canvas_artifact.py
      - name: Verify connector write and Change required-field contracts
        run: python3 tools/companion/verify_canvas_write_contract.py
      - name: Validate person search source contract
        shell: pwsh
        run: |
          ./powerplatform/scripts/Test-CanvasPersonSource.ps1
      - name: Validate Canvas choice source and compiler contract
        shell: pwsh
        run: ./powerplatform/scripts/Test-CanvasChoiceContract.ps1
      - name: Validate additive System description schema and metadata contract
        shell: pwsh
        run: ./provisioning/Scripts/Test-SystemDescriptionContract.ps1
      - name: Validate Change schema prerequisites and bounded metadata delta
        shell: pwsh
        run: |
          ./provisioning/Scripts/Test-AssetTitleContract.ps1 -ObjectType Change
          ./provisioning/Scripts/Test-ChangeContract.ps1
      - name: Validate record core source and compiler contract
        shell: pwsh
        run: ./powerplatform/scripts/Test-CanvasRecordCore.ps1
      - name: Validate Change Canvas lifecycle and native field contract
        shell: pwsh
        run: ./powerplatform/scripts/Test-CanvasChangeContract.ps1
