name: Validate repository
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax and repository checks
        shell: pwsh
        run: |
          git diff --check HEAD~1 HEAD 2>/dev/null || git diff --check
          Get-ChildItem powerplatform/scripts -Filter *.ps1 -Recurse | ForEach-Object { [void][scriptblock]::Create((Get-Content $_.FullName -Raw)) }
      - name: Test document approval workflow
        run: python3 tests/test_document_approval_flow.py

      - name: Test Incident transitions
        run: python3 tests/test_incident_transition_flow.py

      - name: Test Control ownership and relationships
        run: python3 tests/test_control_write_flow.py

      - name: Test Measure lifecycle and effectiveness proof
        run: python3 tests/test_measure_write_flow.py
