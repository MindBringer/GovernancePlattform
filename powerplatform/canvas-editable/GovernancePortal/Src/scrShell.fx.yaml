scrShell As screen:
    Fill: =gblTheme.ColorWorkspace
    LoadingSpinnerColor: =gblTheme.ColorPrimary
    OnVisible: =If(!gblInitialized, Set(gblBusy, true); Set(gblBusyMessage, "Initialisierung wird abgeschlossen …"))

    conRoot As groupContainer:
        DropShadow: =DropShadow.None
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Width: =Parent.Width

        conBusyOverlay As groupContainer:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 0.78)
            Height: =Parent.Height
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =gblBusy
            Width: =Parent.Width
            ZIndex: =20

            lblBusyMessage As label:
                Align: =Align.Center
                Color: =gblTheme.ColorText
                FontWeight: =FontWeight.Semibold
                Height: =48
                Text: =Coalesce(gblBusyMessage, "Bitte warten …")
                Width: =420
                X: =(Parent.Width - Self.Width) / 2
                Y: =(Parent.Height - Self.Height) / 2
                ZIndex: =1

        conFooter As groupContainer:
            DropShadow: =DropShadow.None
            Fill: =gblTheme.ColorFooter
            Height: =gblTheme.FooterHeight
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
            ZIndex: =6

            lblFooterStatus As label:
                Color: =If(gblDataError, gblTheme.ColorError, gblTheme.ColorTextMuted)
                Height: =Parent.Height
                Size: =10
                Text: =If(gblDataError, "Metadaten konnten nicht vollständig geladen werden", If(gblInitialized, "Bereit", "Initialisierung")) & " · " & gblEnvironment & " · " & gblAppVersion & " · Build " & Text(gblBuildDate, "dd.mm.yyyy hh:mm") & If(!IsBlank(gblBuildCommit), " · " & gblBuildCommit, "") & " · Refresh " & Text(gblLastRefresh, "dd.mm.yyyy hh:mm")
                Width: =Parent.Width - 32
                X: =16
                ZIndex: =2

        conBody As groupContainer:
            DropShadow: =DropShadow.None
            Fill: =gblTheme.ColorWorkspace
            Height: =Parent.Height - gblTheme.HeaderHeight - gblTheme.FooterHeight
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =gblTheme.HeaderHeight
            ZIndex: =7

            conWorkspace As groupContainer:
                DropShadow: =DropShadow.None
                Fill: =gblTheme.ColorWorkspace
                Height: =Parent.Height
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =0
                RadiusBottomRight: =0
                RadiusTopLeft: =0
                RadiusTopRight: =0
                Width: =Parent.Width - conNavigation.Width
                X: =conNavigation.Width
                ZIndex: =3

                conWorkspaceContent As groupContainer:
                    DropShadow: =DropShadow.None
                    Fill: =gblTheme.ColorWorkspace
                    Height: =Parent.Height - (2 * gblTheme.ContentPadding)
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    RadiusBottomLeft: =0
                    RadiusBottomRight: =0
                    RadiusTopLeft: =0
                    RadiusTopRight: =0
                    Width: =Parent.Width - (2 * gblTheme.ContentPadding)
                    X: =gblTheme.ContentPadding
                    Y: =gblTheme.ContentPadding
                    ZIndex: =2

                    lblPageTitle As label:
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =24
                        Text: =Coalesce(LookUp(colPages, PageKey = gblCurrentPage, DisplayNameDE), LookUp(colNavigation, Key = gblCurrentPage, Label), "Governance Portal")
                        Width: =Parent.Width - 220
                        ZIndex: =1

                    lblRefresh As label:
                        Align: =Align.Center
                        BorderColor: =gblTheme.ColorBorder
                        BorderThickness: =1
                        Color: =gblTheme.ColorPrimary
                        Fill: =gblTheme.ColorSurface
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: |-
                            =Set(gblBusy, true);
                            Set(gblBusyMessage, "Metadaten werden aktualisiert …");
                            Refresh(PageDefinitions);
                            Refresh(NavigationDefinitions);
                            Refresh(ObjectTypes);
                            Refresh(FormDefinitions);
                            Refresh(FormFieldDefinitions);
                            Refresh(FieldDefinitions);
                            Refresh(ValidationDefinitions);
                            Set(gblLastRefresh, Now());
                            Set(gblBusy, false);
                            Set(gblBusyMessage, Blank())
                        Text: ="Aktualisieren"
                        Width: =120
                        X: =Parent.Width - Self.Width
                        ZIndex: =2

                    lblNew As label:
                        Align: =Align.Center
                        BorderColor: =gblTheme.ColorPrimary
                        BorderThickness: =1
                        Color: =gblTheme.ColorTextInverse
                        Fill: =gblTheme.ColorPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        OnSelect: |-
                            =Set(gblEditorMode, "New");
                            Set(gblObjectType, Coalesce(LookUp(colNavigation, Key = gblCurrentPage, ObjectTypeKey), gblObjectType, First(colObjectTypes).ObjectTypeKey));
                            Set(gblSelectedObjectDefinition, LookUp(colObjectTypes, ObjectTypeKey = gblObjectType));
                            Set(gblSelectedRecord, Blank());
                            ClearCollect(
                                colEditorValues,
                                ForAll(
                                    SortByColumns(
                                        Filter(
                                            colFormFields,
                                            ObjectTypeKey = gblObjectType &&
                                            FormMode = "Edit"
                                        ),
                                        "SortOrder",
                                        SortOrder.Ascending
                                    ) As formField,
                                    With(
                                        {
                                            fieldDefinition: LookUp(
                                                colFieldDefinitions,
                                                ObjectTypeKey = gblObjectType &&
                                                FieldInternalName = formField.FieldInternalName
                                            )
                                        },
                                        {
                                            FormFieldDefinitionKey: formField.FormFieldDefinitionKey,
                                            FieldDefinitionKey: fieldDefinition.FieldDefinitionKey,
                                            ObjectTypeKey: gblObjectType,
                                            FieldInternalName: formField.FieldInternalName,
                                            DisplayNameDE: Coalesce(formField.OverrideLabelDE, fieldDefinition.DisplayNameDE, formField.FieldInternalName),
                                            ControlType: Coalesce(fieldDefinition.ControlType, "Text"),
                                            ChoiceSetKey: Coalesce(fieldDefinition.ChoiceSetKey, ""),
                                            LookupObjectTypeKey: Coalesce(fieldDefinition.LookupObjectTypeKey, ""),
                                            SectionKey: Coalesce(formField.SectionKey, fieldDefinition.SectionKey, "General"),
                                            SortOrder: formField.SortOrder,
                                            IsRequired: Coalesce(fieldDefinition.IsRequired, false) || !IsBlank(formField.RequiredIf),
                                            IsReadOnly: Coalesce(fieldDefinition.IsReadOnly, false),
                                            DefaultValue: Coalesce(fieldDefinition.DefaultValue, ""),
                                            ValueText: Coalesce(fieldDefinition.DefaultValue, ""),
                                            ValueNumber: Blank(),
                                            ValueBoolean: Blank(),
                                            ValueDate: Blank(),
                                            ValueChoiceKey: "",
                                            ValueLookupId: Blank(),
                                            IsDirty: false,
                                            IsValid: true,
                                            ErrorMessage: ""
                                        }
                                    )
                                )
                            );
                            Set(gblEditorDirty, false);
                            Set(gblEditorCanSave, false);
                            Set(gblCurrentPage, "editor")
                        Text: ="Neu"
                        Visible: =gblCurrentPage <> "home" && gblCurrentPage <> "editor"
                        Width: =80
                        X: =lblRefresh.X - Self.Width - 12
                        ZIndex: =3

                    "galDashboardCards As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                        DelayItemLoading: =true
                        Height: =Min(220, Parent.Height - 80)
                        Items: =SortByColumns(colDashboardCards, "SortOrder", SortOrder.Ascending)
                        Layout: =Layout.Horizontal
                        LoadingSpinner: =LoadingSpinner.Data
                        OnSelect: =Set(gblCurrentPage, ThisItem.TargetPage)
                        TemplatePadding: =8
                        TemplateSize: =190
                        Visible: =gblCurrentPage = "home"
                        Width: =Parent.Width
                        Y: =64
                        ZIndex: =4

                        lblDashboardValue As label:
                            Align: =Align.Center
                            Color: =gblTheme.ColorPrimary
                            Fill: =gblTheme.ColorSurface
                            FontWeight: =FontWeight.Bold
                            Height: =92
                            OnSelect: =Select(Parent)
                            Size: =28
                            Text: =Text(ThisItem.Value)
                            Width: =Parent.TemplateWidth - 16
                            X: =8
                            Y: =8
                            ZIndex: =1

                        lblDashboardTitle As label:
                            Align: =Align.Center
                            Color: =gblTheme.ColorText
                            Fill: =gblTheme.ColorSurface
                            FontWeight: =FontWeight.Semibold
                            Height: =56
                            OnSelect: =Select(Parent)
                            Text: =ThisItem.Title
                            Width: =Parent.TemplateWidth - 16
                            X: =8
                            Y: =100
                            ZIndex: =2

                    lblFrameworkIntro As label:
                        Color: =gblTheme.ColorTextMuted
                        Height: =54
                        Text: ="Das Framework lädt Navigation, Objekttypen, Formulare, Felder und Validierungen aus den zentralen SharePoint-Metadatenlisten."
                        Visible: =gblCurrentPage = "home"
                        Width: =Parent.Width
                        Y: =292
                        ZIndex: =5

                    "galObjectTypes As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                        DelayItemLoading: =true
                        Height: =Parent.Height - 124
                        Items: =If(gblCurrentPage = "objects", colObjectTypes, Filter(colObjectTypes, ObjectTypeKey = Coalesce(LookUp(colNavigation, Key = gblCurrentPage, ObjectTypeKey), gblObjectType)))
                        Layout: =Layout.Vertical
                        LoadingSpinner: =LoadingSpinner.Data
                        OnSelect: |-
                            =Set(gblObjectType, ThisItem.ObjectTypeKey);
                            Set(gblSelectedObjectDefinition, ThisItem)
                        TemplatePadding: =4
                        TemplateSize: =72
                        Visible: =gblCurrentPage <> "home" && gblCurrentPage <> "editor" && gblCurrentPage <> "fields" && gblCurrentPage <> "forms" && gblCurrentPage <> "validation" && gblCurrentPage <> "pages"
                        Width: =Min(420, Parent.Width)
                        Y: =64
                        ZIndex: =6

                        lblObjectTypeTitle As label:
                            Color: =gblTheme.ColorText
                            Fill: =If(ThisItem.ObjectTypeKey = gblObjectType, gblTheme.ColorSelected, gblTheme.ColorSurface)
                            FontWeight: =FontWeight.Semibold
                            Height: =36
                            OnSelect: =Select(Parent)
                            PaddingLeft: =12
                            Text: =Coalesce(ThisItem.DisplayNameDE, ThisItem.Title)
                            Width: =Parent.TemplateWidth
                            ZIndex: =1

                        lblObjectTypeMeta As label:
                            Color: =gblTheme.ColorTextMuted
                            Fill: =If(ThisItem.ObjectTypeKey = gblObjectType, gblTheme.ColorSelected, gblTheme.ColorSurface)
                            Height: =28
                            OnSelect: =Select(Parent)
                            PaddingLeft: =12
                            Size: =10
                            Text: =ThisItem.ObjectTypeKey & " · " & ThisItem.SourceListTitle & " · " & CountRows(Filter(colFieldDefinitions, ObjectTypeKey = ThisItem.ObjectTypeKey)) & " Felder"
                            Width: =Parent.TemplateWidth
                            Y: =36
                            ZIndex: =2

                    "galMetadata As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                        DelayItemLoading: =true
                        Height: =Parent.Height - 124
                        Items: =Switch(gblCurrentPage, "fields", colFieldDefinitions, "forms", colFormDefinitions, "validation", colValidationDefinitions, "pages", colPages, colFieldDefinitions)
                        Layout: =Layout.Vertical
                        LoadingSpinner: =LoadingSpinner.Data
                        TemplatePadding: =4
                        TemplateSize: =64
                        Visible: =gblCurrentPage = "fields" || gblCurrentPage = "forms" || gblCurrentPage = "validation" || gblCurrentPage = "pages"
                        Width: =Parent.Width
                        Y: =64
                        ZIndex: =7

                        lblMetadataTitle As label:
                            Color: =gblTheme.ColorText
                            Fill: =gblTheme.ColorSurface
                            FontWeight: =FontWeight.Semibold
                            Height: =32
                            PaddingLeft: =12
                            Text: =Switch(gblCurrentPage, "fields", Coalesce(ThisItem.DisplayNameDE, ThisItem.FieldInternalName), "forms", Coalesce(ThisItem.SectionTitleDE, ThisItem.FormDefinitionKey), "validation", Coalesce(ThisItem.MessageDE, ThisItem.ValidationKey), "pages", Coalesce(ThisItem.DisplayNameDE, ThisItem.PageKey), ThisItem.Title)
                            Width: =Parent.TemplateWidth
                            ZIndex: =1

                        lblMetadataDetail As label:
                            Color: =gblTheme.ColorTextMuted
                            Fill: =gblTheme.ColorSurface
                            Height: =26
                            PaddingLeft: =12
                            Size: =10
                            Text: =Switch(gblCurrentPage, "fields", ThisItem.ObjectTypeKey & " · " & ThisItem.FieldInternalName & " · " & ThisItem.ControlType, "forms", ThisItem.ObjectTypeKey & " · " & ThisItem.FormMode & " · " & ThisItem.SectionKey, "validation", ThisItem.ObjectTypeKey & " · " & ThisItem.RuleType & " · " & ThisItem.Severity, "pages", ThisItem.PageKey & " · " & ThisItem.PageType & " · " & ThisItem.ScreenName, "")
                            Width: =Parent.TemplateWidth
                            Y: =32
                            ZIndex: =2

                    conEditor As groupContainer:
                        DropShadow: =DropShadow.None
                        Fill: =gblTheme.ColorSurface
                        Height: =Parent.Height - 72
                        LayoutGridColumnMinWidth: =0
                        LayoutGridColumns: =6
                        LayoutGridRowMinHeight: =0
                        LayoutGridRows: =6
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =gblCurrentPage = "editor"
                        Width: =Parent.Width
                        Y: =64
                        ZIndex: =8

                        lblEditorTitle As label:
                            Color: =gblTheme.ColorText
                            FontWeight: =FontWeight.Semibold
                            Height: =42
                            Size: =18
                            Text: =If(gblEditorMode = "New", "Neu: ", "Bearbeiten: ") & Coalesce(gblSelectedObjectDefinition.DisplayNameDE, gblObjectType)
                            Width: =Parent.Width - 160
                            X: =16
                            Y: =8
                            ZIndex: =1

                        lblEditorCancel As label:
                            Align: =Align.Center
                            BorderColor: =gblTheme.ColorBorder
                            BorderThickness: =1
                            Color: =gblTheme.ColorPrimary
                            Height: =34
                            OnSelect: |-
                                =Clear(colEditorValues);
                                Set(gblEditorDirty, false);
                                Set(gblEditorCanSave, false);
                                Set(gblEditorMode, Blank());
                                Set(gblSelectedRecord, Blank());
                                Set(gblCurrentPage, "home")
                            Text: ="Abbrechen"
                            Width: =100
                            X: =Parent.Width - Self.Width - 16
                            Y: =12
                            ZIndex: =2

                        "galEditorFields As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                            DelayItemLoading: =true
                            Height: =Parent.Height - 112
                            Items: =SortByColumns(colEditorValues, "SortOrder", SortOrder.Ascending)
                            Layout: =Layout.Vertical
                            LoadingSpinner: =LoadingSpinner.Data
                            TemplatePadding: =6
                            TemplateSize: =124
                            Width: =Parent.Width - 32
                            X: =16
                            Y: =56
                            ZIndex: =3

                            lblEditorField As label:
                                Color: =gblTheme.ColorText
                                FontWeight: =FontWeight.Semibold
                                Height: =28
                                PaddingLeft: =4
                                Text: =ThisItem.DisplayNameDE & If(ThisItem.IsRequired, " *", "")
                                Width: =Parent.TemplateWidth - 8
                                X: =4
                                ZIndex: =1

                            txtEditorText As text:
                                BorderColor: =If(ThisItem.IsValid, gblTheme.ColorBorder, gblTheme.ColorError)
                                Default: =ThisItem.ValueText
                                DisplayMode: =If(ThisItem.IsReadOnly, DisplayMode.View, DisplayMode.Edit)
                                Height: =40
                                Mode: =If(Lower(ThisItem.ControlType) = "multiline", TextMode.MultiLine, TextMode.SingleLine)
                                OnChange: |-
                                    =Patch(
                                        colEditorValues,
                                        ThisItem,
                                        {
                                            ValueText: Self.Text,
                                            IsDirty: true,
                                            IsValid: !ThisItem.IsRequired || !IsBlank(Trim(Self.Text)),
                                            ErrorMessage: If(ThisItem.IsRequired && IsBlank(Trim(Self.Text)), "Pflichtfeld", "")
                                        }
                                    );
                                    Set(gblEditorDirty, CountRows(Filter(colEditorValues, IsDirty)) > 0);
                                    Set(gblEditorCanSave, CountRows(Filter(colEditorValues, !IsValid)) = 0 && CountRows(Filter(colEditorValues, IsRequired && IsBlank(ValueText) && IsBlank(ValueNumber) && IsBlank(ValueDate) && IsBlank(ValueChoiceKey) && IsBlank(ValueBoolean))) = 0)
                                Visible: =Lower(ThisItem.ControlType) = "text" || Lower(ThisItem.ControlType) = "multiline" || Lower(ThisItem.ControlType) = "email" || Lower(ThisItem.ControlType) = "url"
                                Width: =Parent.TemplateWidth - 8
                                X: =4
                                Y: =30
                                ZIndex: =2

                            txtEditorNumber As text:
                                BorderColor: =If(ThisItem.IsValid, gblTheme.ColorBorder, gblTheme.ColorError)
                                Default: =If(IsBlank(ThisItem.ValueNumber), "", Text(ThisItem.ValueNumber))
                                DisplayMode: =If(ThisItem.IsReadOnly, DisplayMode.View, DisplayMode.Edit)
                                Format: =TextFormat.Number
                                Height: =40
                                OnChange: |-
                                    =Patch(
                                        colEditorValues,
                                        ThisItem,
                                        {
                                            ValueNumber: If(IsBlank(Self.Text), Blank(), Value(Self.Text)),
                                            IsDirty: true,
                                            IsValid: !ThisItem.IsRequired || !IsBlank(Self.Text),
                                            ErrorMessage: If(ThisItem.IsRequired && IsBlank(Self.Text), "Pflichtfeld", "")
                                        }
                                    );
                                    Set(gblEditorDirty, CountRows(Filter(colEditorValues, IsDirty)) > 0);
                                    Set(gblEditorCanSave, CountRows(Filter(colEditorValues, !IsValid)) = 0)
                                Visible: =Lower(ThisItem.ControlType) = "number" || Lower(ThisItem.ControlType) = "currency" || Lower(ThisItem.ControlType) = "decimal"
                                Width: =Parent.TemplateWidth - 8
                                X: =4
                                Y: =30
                                ZIndex: =3

                            togEditorBoolean As toggle:
                                Default: =Coalesce(ThisItem.ValueBoolean, false)
                                DisplayMode: =If(ThisItem.IsReadOnly, DisplayMode.View, DisplayMode.Edit)
                                Height: =40
                                OnChange: |-
                                    =Patch(
                                        colEditorValues,
                                        ThisItem,
                                        {
                                            ValueBoolean: Self.Value,
                                            IsDirty: true,
                                            IsValid: true,
                                            ErrorMessage: ""
                                        }
                                    );
                                    Set(gblEditorDirty, CountRows(Filter(colEditorValues, IsDirty)) > 0);
                                    Set(gblEditorCanSave, CountRows(Filter(colEditorValues, !IsValid)) = 0)
                                Visible: =Lower(ThisItem.ControlType) = "boolean" || Lower(ThisItem.ControlType) = "toggle" || Lower(ThisItem.ControlType) = "yesno"
                                Width: =120
                                X: =4
                                Y: =30
                                ZIndex: =4

                            datEditorDate As datePicker:
                                BorderColor: =If(ThisItem.IsValid, gblTheme.ColorBorder, gblTheme.ColorError)
                                DefaultDate: =ThisItem.ValueDate
                                DisplayMode: =If(ThisItem.IsReadOnly, DisplayMode.View, DisplayMode.Edit)
                                Height: =40
                                OnChange: |-
                                    =Patch(
                                        colEditorValues,
                                        ThisItem,
                                        {
                                            ValueDate: Self.SelectedDate,
                                            IsDirty: true,
                                            IsValid: !ThisItem.IsRequired || !IsBlank(Self.SelectedDate),
                                            ErrorMessage: If(ThisItem.IsRequired && IsBlank(Self.SelectedDate), "Pflichtfeld", "")
                                        }
                                    );
                                    Set(gblEditorDirty, CountRows(Filter(colEditorValues, IsDirty)) > 0);
                                    Set(gblEditorCanSave, CountRows(Filter(colEditorValues, !IsValid)) = 0)
                                Visible: =Lower(ThisItem.ControlType) = "date" || Lower(ThisItem.ControlType) = "datetime"
                                Width: =260
                                X: =4
                                Y: =30
                                ZIndex: =5

                            drpEditorChoice As dropdown:
                                BorderColor: =If(ThisItem.IsValid, gblTheme.ColorBorder, gblTheme.ColorError)
                                Default: =Coalesce(LookUp(colChoiceValues, ChoiceSetKey = ThisItem.ChoiceSetKey && ChoiceKey = ThisItem.ValueChoiceKey, DisplayNameDE), "")
                                DisplayMode: =If(ThisItem.IsReadOnly, DisplayMode.View, DisplayMode.Edit)
                                Height: =40
                                Items: =SortByColumns(Filter(colChoiceValues, ChoiceSetKey = ThisItem.ChoiceSetKey), "SortOrder", SortOrder.Ascending)
                                OnChange: |-
                                    =Patch(
                                        colEditorValues,
                                        ThisItem,
                                        {
                                            ValueChoiceKey: Coalesce(Self.Selected.ChoiceKey, ""),
                                            ValueText: Coalesce(Self.Selected.DisplayNameDE, ""),
                                            IsDirty: true,
                                            IsValid: !ThisItem.IsRequired || !IsBlank(Self.Selected.ChoiceKey),
                                            ErrorMessage: If(ThisItem.IsRequired && IsBlank(Self.Selected.ChoiceKey), "Pflichtfeld", "")
                                        }
                                    );
                                    Set(gblEditorDirty, CountRows(Filter(colEditorValues, IsDirty)) > 0);
                                    Set(gblEditorCanSave, CountRows(Filter(colEditorValues, !IsValid)) = 0)
                                Value: ="DisplayNameDE"
                                Visible: =Lower(ThisItem.ControlType) = "choice" || Lower(ThisItem.ControlType) = "dropdown"
                                Width: =Min(420, Parent.TemplateWidth - 8)
                                X: =4
                                Y: =30
                                ZIndex: =6

                            lblEditorUnsupported As label:
                                Color: =gblTheme.ColorWarning
                                Height: =40
                                PaddingLeft: =4
                                Text: ="Steuerelementtyp wird in diesem Schritt noch nicht unterstützt: " & ThisItem.ControlType
                                Visible: =!(Lower(ThisItem.ControlType) in ["text", "multiline", "email", "url", "number", "currency", "decimal", "boolean", "toggle", "yesno", "date", "datetime", "choice", "dropdown"])
                                Width: =Parent.TemplateWidth - 8
                                X: =4
                                Y: =30
                                ZIndex: =7

                            lblEditorFieldMeta As label:
                                Color: =If(ThisItem.IsValid, gblTheme.ColorTextMuted, gblTheme.ColorError)
                                Height: =24
                                PaddingLeft: =4
                                Size: =9
                                Text: =If(!ThisItem.IsValid, ThisItem.ErrorMessage & " · ", "") & ThisItem.FieldInternalName & " · " & ThisItem.ControlType & " · " & ThisItem.SectionKey & If(ThisItem.IsReadOnly, " · schreibgeschützt", "")
                                Width: =Parent.TemplateWidth - 8
                                X: =4
                                Y: =74
                                ZIndex: =8

            conNavigation As groupContainer:
                DropShadow: =DropShadow.None
                Fill: =gblTheme.ColorNavigation
                Height: =Parent.Height
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =0
                RadiusBottomRight: =0
                RadiusTopLeft: =0
                RadiusTopRight: =0
                Width: =If(App.Width < gblTheme.BreakpointCompact, gblTheme.NavigationWidthCompact, gblTheme.NavigationWidth)
                ZIndex: =4

                "galNavigation As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                    DelayItemLoading: =true
                    Fill: =Color.Transparent
                    Height: =Parent.Height
                    Items: =SortByColumns(colNavigation, "SortOrder", SortOrder.Ascending)
                    Layout: =Layout.Vertical
                    LoadingSpinner: =LoadingSpinner.Data
                    OnSelect: |-
                        =Set(gblCurrentPage, ThisItem.Key);
                        Set(gblObjectType, ThisItem.ObjectTypeKey);
                        Set(gblSelectedObjectDefinition, LookUp(colObjectTypes, ObjectTypeKey = gblObjectType))
                    TemplatePadding: =0
                    TemplateSize: =48
                    Width: =Parent.Width
                    ZIndex: =1

                    lblNavigationItem As label:
                        Align: =If(App.Width < gblTheme.BreakpointCompact, Align.Center, Align.Left)
                        Color: =gblTheme.ColorText
                        Fill: =If(ThisItem.Key = gblCurrentPage, gblTheme.ColorSelected, Color.Transparent)
                        FontWeight: =If(ThisItem.Key = gblCurrentPage, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.TemplateHeight
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =If(App.Width < gblTheme.BreakpointCompact, 0, 20)
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =If(App.Width < gblTheme.BreakpointCompact, ThisItem.ShortLabel, ThisItem.Label)
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.TemplateWidth
                        ZIndex: =2

        conHeader As groupContainer:
            DropShadow: =DropShadow.None
            Fill: =gblTheme.ColorPrimary
            Height: =gblTheme.HeaderHeight
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            ZIndex: =8

            lblAppTitle As label:
                Color: =gblTheme.ColorTextInverse
                FontWeight: =FontWeight.Semibold
                Height: =Parent.Height
                Size: =20
                Text: ="Governance Portal"
                Width: =320
                X: =24
                ZIndex: =1

            lblUser As label:
                Align: =Align.Right
                Color: =gblTheme.ColorTextInverse
                Height: =Parent.Height
                Text: =Coalesce(gblUser.FullName, gblUser.Email, "Benutzer")
                Visible: =App.Width >= gblTheme.BreakpointCompact
                Width: =260
                X: =Parent.Width - Self.Width - 24
                ZIndex: =2

            lblEnvironment As label:
                Align: =Align.Right
                Color: =gblTheme.ColorTextInverse
                Height: =Parent.Height
                Text: =gblEnvironment & " · " & gblAppVersion & " · Build " & Text(gblBuildDate, "dd.mm.yyyy")
                Width: =220
                X: =If(lblUser.Visible, lblUser.X - Self.Width - 16, Parent.Width - Self.Width - 24)
                ZIndex: =3
