App As appinfo:
    BackEnabled: =true
    OnStart: |-
        =Set(gblAppVersion, "1.0.0-alpha.3.0");
        Set(gblInitialized, false);
        Set(gblBusy, true);
        Set(gblBusyMessage, "Governance Framework wird initialisiert …");
        Set(gblCurrentPage, "home");
        Set(gblEnvironment, "DEV");
        Set(gblUser, User());
        Set(gblEditorMode, Blank());
        Set(gblObjectType, Blank());
        Set(gblSelectedRecord, Blank());
        Set(gblSelectedObjectDefinition, Blank());
        Set(gblDataError, false);
        Set(gblLastRefresh, Now());
        Set(
            gblTheme,
            {
                ColorPrimary: RGBA(32, 68, 105, 1),
                ColorPrimaryDark: RGBA(22, 47, 74, 1),
                ColorNavigation: RGBA(245, 247, 250, 1),
                ColorWorkspace: RGBA(255, 255, 255, 1),
                ColorSurface: RGBA(250, 251, 252, 1),
                ColorFooter: RGBA(236, 239, 243, 1),
                ColorBorder: RGBA(210, 216, 224, 1),
                ColorText: RGBA(33, 37, 41, 1),
                ColorTextMuted: RGBA(92, 101, 111, 1),
                ColorTextInverse: RGBA(255, 255, 255, 1),
                ColorSelected: RGBA(224, 235, 247, 1),
                ColorSuccess: RGBA(16, 124, 16, 1),
                ColorWarning: RGBA(157, 93, 0, 1),
                ColorError: RGBA(164, 38, 44, 1),
                HeaderHeight: 64,
                FooterHeight: 32,
                NavigationWidth: 248,
                NavigationWidthCompact: 72,
                BreakpointCompact: 900,
                ContentPadding: 24,
                CardGap: 16
            }
        );
        IfError(
            Concurrent(
                ClearCollect(colPages, SortByColumns(Filter(PageDefinitions, IsActive = true), "SortOrder", SortOrder.Ascending)),
                ClearCollect(colNavigationDefinitions, SortByColumns(Filter(NavigationDefinitions, IsActive = true && IsVisible = true), "SortOrder", SortOrder.Ascending)),
                ClearCollect(colObjectTypes, SortByColumns(Filter(ObjectTypes, IsActive = true), "SortOrder", SortOrder.Ascending)),
                ClearCollect(colFormDefinitions, SortByColumns(Filter(FormDefinitions, IsActive = true), "SortOrder", SortOrder.Ascending)),
                ClearCollect(colFormFields, SortByColumns(Filter(FormFieldDefinitions, IsActive = true), "SortOrder", SortOrder.Ascending)),
                ClearCollect(colFieldDefinitions, SortByColumns(Filter(FieldDefinitions, IsActive = true), "SortOrder", SortOrder.Ascending)),
                ClearCollect(colValidationDefinitions, SortByColumns(Filter(ValidationDefinitions, IsActive = true), "SortOrder", SortOrder.Ascending)),
                ClearCollect(colBusinessRules, SortByColumns(Filter(BusinessRuleDefinitions, IsActive = true), "SortOrder", SortOrder.Ascending)),
                ClearCollect(colAppSettings, SortByColumns(Filter(AppSettings, IsActive = true), "SortOrder", SortOrder.Ascending))
            ),
            Set(gblDataError, true)
        );
        ClearCollect(
            colNavigation,
            AddColumns(
                colNavigationDefinitions,
                Key, Coalesce(PageKey, NavigationKey),
                Label, Coalesce(DisplayNameDE, Title),
                ShortLabel, Upper(Left(Coalesce(DisplayNameDE, Title), 2))
            )
        );
        If(
            IsEmpty(colNavigation),
            ClearCollect(
                colNavigation,
                {Key: "home", Label: "Start", ShortLabel: "ST", SortOrder: 10, ObjectTypeKey: Blank()},
                {Key: "assets", Label: "Assets", ShortLabel: "AS", SortOrder: 20, ObjectTypeKey: "Asset"},
                {Key: "systems", Label: "Systeme", ShortLabel: "SY", SortOrder: 30, ObjectTypeKey: "System"},
                {Key: "incidents", Label: "Incidents", ShortLabel: "IN", SortOrder: 40, ObjectTypeKey: "Incident"},
                {Key: "problems", Label: "Problems", ShortLabel: "PR", SortOrder: 50, ObjectTypeKey: "Problem"},
                {Key: "changes", Label: "Changes", ShortLabel: "CH", SortOrder: 60, ObjectTypeKey: "Change"},
                {Key: "risks", Label: "Risiken", ShortLabel: "RI", SortOrder: 70, ObjectTypeKey: "Risk"},
                {Key: "controls", Label: "Controls", ShortLabel: "CO", SortOrder: 80, ObjectTypeKey: "Control"},
                {Key: "measures", Label: "Maßnahmen", ShortLabel: "MA", SortOrder: 90, ObjectTypeKey: "Measure"}
            )
        );
        ClearCollect(
            colDashboardCards,
            {Key: "objects", Title: "Objekttypen", Value: CountRows(colObjectTypes), TargetPage: "objects", SortOrder: 10},
            {Key: "pages", Title: "Seiten", Value: CountRows(colPages), TargetPage: "pages", SortOrder: 20},
            {Key: "fields", Title: "Felddefinitionen", Value: CountRows(colFieldDefinitions), TargetPage: "fields", SortOrder: 30},
            {Key: "forms", Title: "Formularbereiche", Value: CountRows(colFormDefinitions), TargetPage: "forms", SortOrder: 40},
            {Key: "validation", Title: "Validierungsregeln", Value: CountRows(colValidationDefinitions), TargetPage: "validation", SortOrder: 50},
            {Key: "assets", Title: "Assets", Value: CountRows(Assets), TargetPage: "assets", SortOrder: 60}
        );
        ClearCollect(colNotifications, {Id: "", Type: "", Message: "", CreatedAt: Now()});
        Clear(colNotifications);
        ClearCollect(colRecent, {ObjectType: "", ObjectId: "", Title: "", OpenedAt: Now()});
        Clear(colRecent);
        ClearCollect(colFavorites, {ObjectType: "", ObjectId: "", Title: ""});
        Clear(colFavorites);
        Set(gblBusyMessage, Blank());
        Set(gblBusy, false);
        Set(gblInitialized, true)
    Theme: =PowerAppsTheme

    Host As hostControl.DefaultHostControlVariant:
        OnCancel: =false
        OnEdit: =false
        OnNew: =false
        OnSave: =false
        OnView: =false
