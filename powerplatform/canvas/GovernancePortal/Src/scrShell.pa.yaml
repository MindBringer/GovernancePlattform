                                                          EditorFieldKey = ThisItem.EditorFieldKey
                                                      );
                                                      ForAll(
                                                          Self.SelectedItems As selectedLookup,
                                                          Collect(
                                                              colEditorLookupSelections,
                                                              {
                                                                  EditorFieldKey: ThisItem.EditorFieldKey,
                                                                  LookupObjectTypeKey: ThisItem.LookupObjectTypeKey,
                                                                  LookupId: selectedLookup.LookupId,
                                                                  LookupKey: selectedLookup.LookupKey,
                                                                  DisplayText: selectedLookup.DisplayText,
                                                                  SecondaryText: selectedLookup.SecondaryText
                                                              }
                                                          )
                                                      );
                                                      Patch(
                                                          colEditorValues,
                                                          ThisItem,
                                                          {
                                                              ValueLookupId: If(
                                                                  IsEmpty(Self.SelectedItems),
                                                                  Blank(),
                                                                  First(Self.SelectedItems).LookupId
                                                              ),
                                                              ValueLookupText: If(
                                                                  IsEmpty(Self.SelectedItems),
                                                                  "",
                                                                  First(Self.SelectedItems).DisplayText
                                                              ),
                                                              IsDirty: true,
                                                              IsValid: !ThisItem.IsRequired || !IsEmpty(Self.SelectedItems),
                                                              ErrorMessage: If(
                                                                  ThisItem.IsRequired && IsEmpty(Self.SelectedItems),
                                                                  "Pflichtfeld",
                                                                  ""
                                                              )
                                                          }
                                                      );
                                                      Select(lblEditorRevalidate)
                                                  )
                                                SearchFields: =["DisplayText", "SecondaryText"]
                                                SelectMultiple: =ThisItem.AllowMultiple
                                                Visible: =ThisItem.ControlType = "Lookup"
                                                Width: =Parent.TemplateWidth * 0.62
                                                X: =Parent.TemplateWidth * 0.36
                                                Y: =12
                                          - lblEditorUnsupported:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =gblTheme.ColorWarning
                                                BorderThickness: =1
                                                Color: =gblTheme.ColorWarning
                                                Font: =Font.'Open Sans'
                                                PaddingLeft: =10
                                                Text: |-
                                                  ="Noch nicht unterstützter Feldtyp: " & ThisItem.ControlType
                                                Visible: |-
                                                  =Not(
                                                      ThisItem.ControlType in [
                                                          "Text",
                                                          "User",
                                                          "Lookup",
                                                          "Note",
                                                          "MultilineText",
                                                          "Number",
                                                          "Date",
                                                          "DateTime",
                                                          "Boolean",
                                                          "Choice",
                                                          "Lookup",
                                                          "User"
                                                      ]
                                                  )
                                                Width: =Parent.TemplateWidth * 0.62
                                                X: =Parent.TemplateWidth * 0.36
                                                Y: =12
                                          - lblEditorError:
                                              Control: Label@2.5.1
                                              Properties:
                                                Live: =Live.Polite
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                Color: =gblTheme.ColorError
                                                Font: =Font.'Open Sans'
                                                Height: =22
                                                Size: =9
                                                Text: =ThisItem.ErrorMessage
                                                Visible: =!ThisItem.IsValid
                                                Width: =Parent.TemplateWidth * 0.62
                                                X: =Parent.TemplateWidth * 0.36
                                                Y: =84
                                          - cmbEditorPerson:
                                              Control: Classic/ComboBox@2.4.0
                                              Properties:
                                                AccessibleLabel: =ThisItem.DisplayNameDE & If(ThisItem.IsRequired, " (Pflichtfeld)", "") & If(!ThisItem.IsValid, " – " & ThisItem.ErrorMessage, "")
                                                FocusedBorderColor: =gblTheme.ColorText
                                                FocusedBorderThickness: =3
                                                TabIndex: =0
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                ChevronBackground: =RGBA(56, 96, 178, 1)
                                                ChevronFill: =RGBA(255, 255, 255, 1)
                                                ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                                ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                                DefaultSelectedItems: |-
                                                  =If(
                                                      IsBlank(ThisItem.ValuePersonEmail),
                                                      Blank(),
                                                      Table(
                                                          {
                                                              DisplayName: ThisItem.ValueText,
                                                              UserPrincipalName: ThisItem.ValuePersonEmail
                                                          }
                                                      )
                                                  )
                                                DisplayFields: =["DisplayName"]
                                                DisplayMode: =If(gblShowDiscardDialog || gblSaveBusy || gblLoadBusy, DisplayMode.Disabled, If(ThisItem.IsReadOnly, DisplayMode.View, DisplayMode.Edit))
                                                Font: =Font.'Open Sans'
                                                HoverFill: =RGBA(186, 202, 226, 1)
                                                Items: |-
                                                  =ForAll(
                                                      'Office365-Benutzer'.SearchUserV2(
                                                          {
                                                              searchTerm: Self.SearchText,
                                                              top: 20,
                                                              isSearchTermRequired: true
                                                          }
                                                      ).value As usr,
                                                      {
                                                          DisplayName: usr.DisplayName,
                                                          UserPrincipalName: usr.UserPrincipalName
                                                      }
                                                  )
                                                OnChange: |-
                                                  =If(
                                                      Self.Visible && Self.DisplayMode = DisplayMode.Edit && (gblEditorMode <> "Edit" || ((IsEmpty(Self.SelectedItems) && !IsBlank(ThisItem.ValuePersonClaims)) || (!IsEmpty(Self.SelectedItems) && (First(Self.SelectedItems).UserPrincipalName <> ThisItem.ValuePersonEmail || First(Self.SelectedItems).DisplayName <> ThisItem.ValueText)))),
                                                      If(
                                                          IsEmpty(Self.SelectedItems),

                                                          Patch(
                                                              colEditorValues,
                                                              ThisItem,
                                                              {
                                                                  ValueText: "",
                                                                  ValuePersonEmail: "",
                                                                  ValuePersonClaims: "",
                                                                  ValuePersonDepartment: "",
                                                                  ValuePersonJobTitle: "",
                                                                  IsDirty: true,
                                                                  IsValid: !ThisItem.IsRequired,
                                                                  ErrorMessage:
                                                                      If(
                                                                          ThisItem.IsRequired,
                                                                          "Pflichtfeld",
                                                                          ""
                                                                      )
                                                              }
                                                          ),

                                                          With(
                                                              {
                                                                  selectedPerson: First(Self.SelectedItems)
                                                              },
                                                              Patch(
                                                                  colEditorValues,
                                                                  ThisItem,
                                                                  {
                                                                      ValueText:
                                                                          selectedPerson.DisplayName,
                                                                      ValuePersonEmail:
                                                                          selectedPerson.UserPrincipalName,
                                                                      ValuePersonClaims:
                                                                          "i:0#.f|membership|" &
                                                                          Lower(selectedPerson.UserPrincipalName),
                                                                      ValuePersonDepartment: "",
                                                                      ValuePersonJobTitle: "",
                                                                      IsDirty: true,
                                                                      IsValid: true,
                                                                      ErrorMessage: ""
                                                                  }
                                                              )
                                                          )
                                                      )
                                                      ;
                                                      Select(lblEditorRevalidate)
                                                  )
                                                PressedColor: =RGBA(255, 255, 255, 1)
                                                PressedFill: =RGBA(0, 18, 107, 1)
                                                SearchFields: =["DisplayName"]
                                                SelectMultiple: =false
                                                SelectionColor: =RGBA(255, 255, 255, 1)
                                                SelectionFill: =RGBA(56, 96, 178, 1)
                                                Visible: =ThisItem.ControlType = "User"
                                                Width: =Parent.TemplateWidth * 0.42
                                                X: =Parent.TemplateWidth * 0.36
                                                Y: =12
                  - conNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblTheme.ColorNavigation
                        Height: =Parent.Height
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(App.Width < gblTheme.BreakpointCompact, gblTheme.NavigationWidthCompact, gblTheme.NavigationWidth)
                      Children:
                        - galNavigation:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              AccessibleLabel: ="Navigation"
                              ItemAccessibleLabel: =ThisItem.Label
                              Selectable: =true
                              TabIndex: =-1
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              Items: =SortByColumns(colNavigation, "SortOrder", SortOrder.Ascending)
                              OnSelect: |-
                                =If(!gblSaveBusy && !gblLoadBusy && !gblShowDiscardDialog,
                                    If(gblCurrentPage = "editor" && gblEditorDirty,
                                        Set(gblPendingNavigationKey, ThisItem.NavKey); Set(gblPendingNavigationPage, ThisItem.TargetPage);
                                        Set(gblShowDiscardDialog, true); SetFocus(lblDiscardStay),
                                Set(gblCurrentNavigationKey, ThisItem.NavKey);
                                Set(gblCurrentPage, ThisItem.TargetPage);

                                Clear(colEditorValues);
                                Set(gblEditorDirty, false);
                                Set(gblEditorCanSave, false);
                                Set(gblEditorMode, "");
                                Set(gblObjectType, "");
                                Set(gblSelectedObjectTypeKey, "");
                                Set(gblSelectedRecordId, 0); Set(gblLoadedRecordId, 0); Set(gblEditorLoadComplete, false); Set(gblEditorConflict, false); Set(gblSaveError, ""); Clear(colRecordValues);
                                        Set(gblRecordError, ""); Set(gblRecordQuery, ""); Set(gblRecordQueryId, 0)
                                    )
                                )
                              TemplateFill: |-
                                =If(
                                    ThisItem.NavKey = gblCurrentNavigationKey,
                                    gblTheme.ColorSelected,
                                    RGBA(0, 0, 0, 0)
                                )
                              TemplateSize: =48
                              Width: =Parent.Width
                            Children:
                              - lblNavigationItem:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    FocusedBorderColor: =gblTheme.ColorText
                                    FocusedBorderThickness: =3
                                    TabIndex: =0
                                    Align: =If(App.Width < gblTheme.BreakpointCompact, Align.Center, Align.Left)
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =gblTheme.ColorText
                                    Fill: =If(ThisItem.Key = gblCurrentPage, gblTheme.ColorSelected, Color.Transparent)
                                    DisplayMode: =If(gblShowDiscardDialog || gblSaveBusy || gblLoadBusy, DisplayMode.Disabled, DisplayMode.Edit)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ThisItem.Key = gblCurrentPage, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =If(App.Width < gblTheme.BreakpointCompact, 0, 20)
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =ThisItem.Label
                                    Width: =Parent.TemplateWidth
            - conHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblTheme.ColorPrimary
                  Height: =gblTheme.HeaderHeight
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblAppTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorTextInverse
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Size: =20
                        Text: ="Governance Portal"
                        Width: =320
                        X: =24
                  - lblUser:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorTextInverse
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        Text: =Coalesce(gblUser.FullName, gblUser.Email, "Benutzer")
                        Visible: =App.Width >= gblTheme.BreakpointCompact
                        Width: =260
                        X: =Parent.Width - Self.Width - 24
                  - lblEnvironment:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorTextInverse
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        Text: =gblEnvironment & " · " & gblAppVersion
                        Width: =220
                        X: =If(lblUser.Visible, lblUser.X - Self.Width - 16, Parent.Width - Self.Width - 24)
            - conDiscardOverlay:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0.28)
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =gblShowDiscardDialog
                  Width: =Parent.Width
                Children:
                  - conDiscardDialog:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.Regular
                        Fill: =gblTheme.ColorSurface
                        Height: =190
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =460
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) / 2
                      Children:
                        - lblDiscardTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblTheme.ColorText
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              Size: =17
                              Text: ="Ungespeicherte Änderungen"
                              Width: =Parent.Width - 48
                              X: =24
                              Y: =18
                        - lblDiscardMessage:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblTheme.ColorTextMuted
                              Font: =Font.'Open Sans'
                              Height: =54
                              Text: ="Die Änderungen wurden noch nicht gespeichert. Sollen sie verworfen werden?"
                              Width: =Parent.Width - 48
                              X: =24
                              Y: =62
                        - lblDiscardStay:
                            Control: Classic/Button@2.2.0
                            Properties:
                              FocusedBorderColor: =gblTheme.ColorText
                              FocusedBorderThickness: =3
                              TabIndex: =0
                              Align: =Align.Center
                              BorderColor: =gblTheme.ColorBorder
                              BorderThickness: =1
                              Color: =gblTheme.ColorPrimary
                              Fill: =gblTheme.ColorSurface
                              Font: =Font.'Open Sans'
                              Height: =36
                              OnSelect: |-
                                =Set(gblShowDiscardDialog, false); Set(gblPendingNavigationKey, ""); SetFocus(lblEditorCancel)
                              Text: ="Weiter bearbeiten"
                              X: =Parent.Width - 326
                              Y: =132
                        - lblDiscardConfirm:
                            Control: Classic/Button@2.2.0
                            Properties:
                              FocusedBorderColor: =gblTheme.ColorText
                              FocusedBorderThickness: =3
                              TabIndex: =0
                              Align: =Align.Center
                              BorderColor: =gblTheme.ColorError
                              BorderThickness: =1
                              Color: =gblTheme.ColorTextInverse
                              Fill: =gblTheme.ColorError
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              OnSelect: |-
                                =Clear(colEditorValues);
                                Clear(colEditorLookupSelections);
                                Clear(colEditorPersonSelections);
                                Clear(colEditorChoiceOptions);
                                Set(gblEditorDirty, false);
                                Set(gblEditorCanSave, false);
                                Set(gblShowDiscardDialog, false);
                                Set(gblCurrentPage, gblPreviousPage);
                                Set(gblEditorMode, "");
                                Set(gblObjectType, gblSelectedObjectTypeKey);
                                Set(gblSelectedRecordId, 0); Set(gblLoadedRecordId, 0); Set(gblEditorLoadComplete, false); Set(gblEditorConflict, false); Set(gblSaveError, ""); Clear(colRecordValues);
                                If(!IsBlank(gblPendingNavigationKey),
                                    Set(gblCurrentNavigationKey, gblPendingNavigationKey); Set(gblCurrentPage, gblPendingNavigationPage);
                                    Set(gblSelectedObjectTypeKey, ""); Set(gblObjectType, ""); Set(gblActiveProvider, Blank());
                                    Set(gblRecordQuery, ""); Set(gblRecordQueryId, 0); Set(gblRecordError, "");
                                    SetFocus(lblRefresh),
                                    SetFocus(lblNew)
                                );
                                Set(gblPendingNavigationKey, "")
                              Text: ="Verwerfen"
                              Width: =130
                              X: =Parent.Width - 154
                              Y: =132
            - conBusyOverlay:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 0.78)
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =gblBusy
                  Width: =Parent.Width
                Children:
                  - lblBusyMessage:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorText
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =48
                        Text: =Coalesce(gblBusyMessage, "Bitte warten …")
                        Width: =420
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) / 2
