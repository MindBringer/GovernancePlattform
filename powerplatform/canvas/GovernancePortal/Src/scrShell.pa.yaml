                                                          IsDirty: true,
                                                          IsValid: !ThisItem.IsRequired || !IsEmpty(Self.SelectedItems),
                                                          ErrorMessage: If(
                                                              ThisItem.IsRequired && IsEmpty(Self.SelectedItems),
                                                              "Pflichtfeld",
                                                              ""
                                                          )
                                                      }
                                                  );
                                                  Set(gblEditorDirty, CountRows(Filter(colEditorValues, IsDirty)) > 0);
                                                  Set(gblEditorCanSave, CountRows(Filter(colEditorValues, !IsValid)) = 0)
                                                SearchFields: =["DisplayName", "Mail", "UserPrincipalName"]
                                                SelectMultiple: =ThisItem.AllowMultiple
                                                Visible: =ThisItem.ControlType = "User"
                                                Width: =Parent.TemplateWidth * 0.62
                                                X: =Parent.TemplateWidth * 0.36
                                                Y: =12
                                          - lblEditorUnsupported:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =gblTheme.ColorWarning
                                                BorderThickness: =1
                                                Color: =gblTheme.ColorWarning
                                                Font: =Font.'Open Sans'
                                                Height: =40
                                                PaddingLeft: =10
                                                Text: |-
                                                  ="Noch nicht unterstützter Feldtyp: " & ThisItem.ControlType
                                                Visible: |-
                                                  =Not(
                                                      ThisItem.ControlType in [
                                                          "Text",
                                                          "User",
                                                          "Lookup",
                                                          "Note",
                                                          "MultilineText",
                                                          "Number",
                                                          "Date",
                                                          "DateTime",
                                                          "Boolean",
                                                          "Choice",
                                                          "Lookup",
                                                          "User"
                                                      ]
                                                  )
                                                Width: =Parent.TemplateWidth * 0.62
                                                X: =Parent.TemplateWidth * 0.36
                                                Y: =12
                                          - lblEditorError:
                                              Control: Label@2.5.1
                                              Properties:
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                Color: =gblTheme.ColorError
                                                Font: =Font.'Open Sans'
                                                Height: =22
                                                Size: =9
                                                Text: =ThisItem.ErrorMessage
                                                Visible: =!ThisItem.IsValid
                                                Width: =Parent.TemplateWidth * 0.62
                                                X: =Parent.TemplateWidth * 0.36
                                                Y: =84
                  - conNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblTheme.ColorNavigation
                        Height: =Parent.Height
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(App.Width < gblTheme.BreakpointCompact, gblTheme.NavigationWidthCompact, gblTheme.NavigationWidth)
                      Children:
                        - galNavigation:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              Items: =SortByColumns(colNavigation, "SortOrder", SortOrder.Ascending)
                              OnSelect: |-
                                =Set(gblCurrentNavigationKey, ThisItem.NavKey);
                                Set(gblCurrentPage, ThisItem.TargetPage);

                                Clear(colEditorValues);
                                Set(gblEditorDirty, false);
                                Set(gblEditorCanSave, false);
                                Set(gblEditorMode, "");
                                Set(gblObjectType, "");
                                Set(gblSelectedObjectTypeKey, "");
                                Set(gblSelectedRecordId, 0)
                              TemplateFill: |-
                                =If(
                                    ThisItem.NavKey = gblCurrentNavigationKey,
                                    gblTheme.ColorSelected,
                                    RGBA(0, 0, 0, 0)
                                )
                              TemplateSize: =48
                              Width: =Parent.Width
                            Children:
                              - lblNavigationItem:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(App.Width < gblTheme.BreakpointCompact, Align.Center, Align.Left)
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =gblTheme.ColorText
                                    Fill: =If(ThisItem.Key = gblCurrentPage, gblTheme.ColorSelected, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ThisItem.Key = gblCurrentPage, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =If(App.Width < gblTheme.BreakpointCompact, 0, 20)
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =ThisItem.Label
                                    Width: =Parent.TemplateWidth
            - conHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblTheme.ColorPrimary
                  Height: =gblTheme.HeaderHeight
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblAppTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorTextInverse
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Size: =20
                        Text: ="Governance Portal"
                        Width: =320
                        X: =24
                  - lblUser:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorTextInverse
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        Text: =Coalesce(gblUser.FullName, gblUser.Email, "Benutzer")
                        Visible: =App.Width >= gblTheme.BreakpointCompact
                        Width: =260
                        X: =Parent.Width - Self.Width - 24
                  - lblEnvironment:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorTextInverse
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        Text: =gblEnvironment & " · " & gblAppVersion
                        Width: =220
                        X: =If(lblUser.Visible, lblUser.X - Self.Width - 16, Parent.Width - Self.Width - 24)
                  - lblEnvironment_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorTextInverse
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        Text: |-
                          =CountRows(
                              Filter(
                                  colFieldDefinitions,
                                  ObjectTypeKey = gblObjectType
                              )
                          )
                        Width: =425
                        X: =366
            - conBusyOverlay:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 0.78)
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =gblBusy
                  Width: =Parent.Width
                Children:
                  - lblBusyMessage:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =gblTheme.ColorText
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =48
                        Text: =Coalesce(gblBusyMessage, "Bitte warten …")
                        Width: =420
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) / 2
