Screens:
  scrShell:
    Properties:
      Fill: =gblTheme.ColorWorkspace
      LoadingSpinnerColor: =gblTheme.ColorPrimary
      OnVisible: =If(!gblInitialized, Set(gblBusy, true); Set(gblBusyMessage, "Initialisierung wird abgeschlossen …"))
    Children:
      - conRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conFooter:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblTheme.ColorFooter
                  Height: =gblTheme.FooterHeight
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                  Y: =Parent.Height - Self.Height
                Children:
                  - lblFooterStatus:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =If(gblDataError, gblTheme.ColorError, gblTheme.ColorTextMuted)
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        Size: =10
                        Text: =If(gblDataError, "Metadaten konnten nicht vollständig geladen werden", If(gblInitialized, "Bereit", "Initialisierung")) & " · " & gblEnvironment & " · " & gblAppVersion & " · " & Text(gblLastRefresh, "dd.mm.yyyy hh:mm")
                        Width: =Parent.Width - 32
                        X: =16
            - conBody:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblTheme.ColorWorkspace
                  Height: =Parent.Height - gblTheme.HeaderHeight - gblTheme.FooterHeight
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                  Y: =gblTheme.HeaderHeight
                Children:
                  - conWorkspace:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblTheme.ColorWorkspace
                        Height: =Parent.Height
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - conNavigation.Width
                        X: =conNavigation.Width
                      Children:
                        - conWorkspaceContent:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =gblTheme.ColorWorkspace
                              Height: =Parent.Height - (2 * gblTheme.ContentPadding)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width - (2 * gblTheme.ContentPadding)
                              X: =gblTheme.ContentPadding
                              Y: =gblTheme.ContentPadding
                            Children:
                              - lblPageTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Size: =24
                                    Text: |-
                                      =Coalesce(
                                          LookUp(
                                              colNavigation,
                                              NavKey = gblCurrentNavigationKey,
                                              Label
                                          ),
                                          "Governance Portal"
                                      )
                                    Width: =Parent.Width - 220
                              - lblRefresh:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =gblTheme.ColorBorder
                                    BorderThickness: =1
                                    Color: =gblTheme.ColorPrimary
                                    Fill: =gblTheme.ColorSurface
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    OnSelect: |-
                                      =Set(gblBusy, true);
                                      Set(gblBusyMessage, "Metadaten werden aktualisiert …");
                                      Refresh(PageDefinitions);
                                      Refresh(NavigationDefinitions);
                                      Refresh(ObjectTypes);
                                      Refresh(FormDefinitions);
                                      Refresh(FormFieldDefinitions);
                                      Refresh(FieldDefinitions);
                                      Refresh(ChoiceValues);
                                      Refresh(ValidationDefinitions);
                                      Set(gblLastRefresh, Now());
                                      Set(gblBusy, false);
                                      Set(gblBusyMessage, Blank())
                                    Text: ="Aktualisieren"
                                    Width: =140
                                    Wrap: =false
                                    X: =Parent.Width - Self.Width
                                    Y: =2
                              - lblNew:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =gblTheme.ColorPrimary
                                    BorderThickness: =1
                                    Color: =gblTheme.ColorTextInverse
                                    DisplayMode: |-
                                      =If(
                                          IsBlank(gblSelectedObjectTypeKey),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    Fill: =gblTheme.ColorPrimary
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    OnSelect: |-
                                      =Set(gblEditorMode, "New");
                                      Set(gblObjectType, gblSelectedObjectTypeKey);
                                      Set(gblSelectedRecordId, 0);
                                      Set(gblPreviousPage, gblCurrentPage);

                                      Clear(colEditorValues);
                                      ForAll(
                                          SortByColumns(
                                              Filter(
                                                  colFormFields,
                                                  ObjectTypeKey = gblSelectedObjectTypeKey
                                              ),
                                              "SortOrder",
                                              SortOrder.Ascending
                                          ) As formField,
                                          With(
                                              {
                                                  fieldDefinition: LookUp(
                                                      colFieldDefinitions,
                                                      ObjectTypeKey = gblSelectedObjectTypeKey
                                                          && FieldInternalName = formField.FieldInternalName
                                                  )
                                              },
                                              Collect(
                                                  colEditorValues,
                                                  {
                                                      EditorFieldKey: gblSelectedObjectTypeKey & ":" & formField.FieldInternalName,
                                                      ObjectTypeKey: gblSelectedObjectTypeKey,
                                                      FieldInternalName: formField.FieldInternalName,
                                                      DisplayNameDE: Coalesce(
                                                          formField.OverrideLabelDE,
                                                          fieldDefinition.DisplayNameDE,
                                                          formField.FieldInternalName
                                                      ),
                                                      ControlType: Coalesce(
                                                          fieldDefinition.ControlType,
                                                          "Text"
                                                      ),
                                                      ChoiceSetKey: Coalesce(
                                                          fieldDefinition.ChoiceSetKey,
                                                          ""
                                                      ),
                                                      LookupObjectTypeKey: Coalesce(
                                                          fieldDefinition.LookupObjectTypeKey,
                                                          ""
                                                      ),
                                                      AllowMultiple: Coalesce(
                                                          fieldDefinition.AllowMultiple,
                                                          false
                                                      ),
                                                      SectionKey: Coalesce(
                                                          formField.SectionKey,
                                                          ""
                                                      ),
                                                      SortOrder: Coalesce(
                                                          formField.SortOrder,
                                                          0
                                                      ),
                                                      IsRequired: !IsBlank(formField.RequiredIf),
                                                      IsReadOnly: false,
                                                      DefaultValue: Coalesce(fieldDefinition.DefaultValue, ""),
                                                      ValueText: If(
                                                          Coalesce(fieldDefinition.ControlType, "Text") in ["Text", "Note", "MultilineText"],
                                                          Coalesce(fieldDefinition.DefaultValue, ""),
                                                          ""
                                                      ),
                                                      ValueNumber: If(
                                                          Coalesce(fieldDefinition.ControlType, "") = "Number"
                                                              && !IsBlank(fieldDefinition.DefaultValue),
                                                          Value(fieldDefinition.DefaultValue),
                                                          If(false, 0, Blank())
                                                      ),
                                                      ValueBoolean: If(
                                                          Coalesce(fieldDefinition.ControlType, "") = "Boolean",
                                                          Lower(Coalesce(fieldDefinition.DefaultValue, "false")) in ["true", "1", "ja", "yes"],
                                                          false
                                                      ),
                                                      ValueDate: If(
                                                          Coalesce(fieldDefinition.ControlType, "") in ["Date", "DateTime"]
                                                              && !IsBlank(fieldDefinition.DefaultValue),
                                                          DateValue(fieldDefinition.DefaultValue),
                                                          If(false, Today(), Blank())
                                                      ),
                                                      ValueChoiceKey: Coalesce(
                                                          LookUp(
                                                              colChoiceValues As choiceValue,
                                                              choiceValue.ChoiceSetKey = fieldDefinition.ChoiceSetKey
                                                                  && choiceValue.IsDefault = true,
                                                              choiceValue.ChoiceKey
                                                          ),
                                                          fieldDefinition.DefaultValue,
                                                          ""
                                                      ),
                                                      ValueLookupId: If(false, 0, Blank()),
                                                      ValueLookupText: "",
                                                      ValuePersonEmail: "",
                                                      ValuePersonClaims: "",
                                                      ValuePersonDepartment: "",
                                                      ValuePersonJobTitle: "",
                                                      IsDirty: false,
                                                      IsValid: If(
                                                          !IsBlank(formField.RequiredIf),
                                                          Switch(
                                                              Coalesce(fieldDefinition.ControlType, "Text"),
                                                              "Boolean", true,
                                                              "Number", !IsBlank(fieldDefinition.DefaultValue),
                                                              "Date", !IsBlank(fieldDefinition.DefaultValue),
                                                              "DateTime", !IsBlank(fieldDefinition.DefaultValue),
                                                              "Choice",
                                                                  !IsBlank(
                                                                      Coalesce(
                                                                          LookUp(
                                                                              colChoiceValues As choiceValue,
                                                                              choiceValue.ChoiceSetKey = fieldDefinition.ChoiceSetKey
                                                                                  && choiceValue.IsDefault = true,
                                                                              choiceValue.ChoiceKey
                                                                          ),
                                                                          fieldDefinition.DefaultValue
                                                                      )
                                                                  ),
                                                              !IsBlank(fieldDefinition.DefaultValue)
                                                          ),
                                                          true
                                                      ),
                                                      ErrorMessage: If(
                                                          !IsBlank(formField.RequiredIf)
                                                              && IsBlank(fieldDefinition.DefaultValue)
                                                              && Coalesce(fieldDefinition.ControlType, "Text") <> "Boolean",
                                                          "Pflichtfeld",
                                                          ""
                                                      )
                                                  }
                                              )
                                          )
                                      );

                                      /*
                                          Stage 3.3: Lookup Registry + Cache + Provider.

                                          Power Fx kann Datenquellen nicht dynamisch anhand eines
                                          Textwertes dereferenzieren. Die Registry beschreibt deshalb
                                          die verfügbaren Ziele; der Provider enthält je verbundener
                                          SharePoint-Liste einen statischen Zweig.

                                          Bereits geladene Ziele bleiben im Cache und werden beim
                                          erneuten Öffnen eines Editors nicht nochmals geladen.
                                      */
                                      ForAll(
                                          Distinct(
                                              Filter(
                                                  colEditorValues,
                                                  ControlType = "Lookup"
                                                      && !IsBlank(LookupObjectTypeKey)
                                              ),
                                              LookupObjectTypeKey
                                          ) As requiredTarget,
                                          Switch(
                                              requiredTarget.Value,
                                              "Asset",
                                              If(
                                                  IsBlank(
                                                      LookUp(
                                                          colLoadedLookupTargets,
                                                          LookupObjectTypeKey = "Asset"
                                                      )
                                                  ),
                                                  Collect(
                                                      colLookupValues,
                                                      AddColumns(
                                                          ShowColumns(
                                                              Assets,
                                                              ID,
                                                              Title,
                                                              GovernanceID,
                                                              IsActive
                                                          ),
                                                          LookupObjectTypeKey,
                                                          "Asset",
                                                          LookupId,
                                                          ID,
                                                          LookupKey,
                                                          Coalesce(GovernanceID, Text(ID)),
                                                          DisplayText,
                                                          Coalesce(Title, GovernanceID, Text(ID)),
                                                          SecondaryText,
                                                          Coalesce(GovernanceID, ""),
                                                          IsActiveValue,
                                                          Coalesce(IsActive, true)
                                                      )
                                                  );
                                                  Collect(
                                                      colLoadedLookupTargets,
                                                      {
                                                          LookupObjectTypeKey: "Asset",
                                                          LoadedAt: Now()
                                                      }
                                                  )
                                              ),
                                              "System",
                                              If(
                                                  IsBlank(
                                                      LookUp(
                                                          colLoadedLookupTargets,
                                                          LookupObjectTypeKey = "System"
                                                      )
                                                  ),
                                                  Collect(
                                                      colLookupValues,
                                                      AddColumns(
                                                          ShowColumns(
                                                              Systems,
                                                              ID,
                                                              Title,
                                                              GovernanceID,
                                                              IsActive
                                                          ),
                                                          LookupObjectTypeKey,
                                                          "System",
                                                          LookupId,
                                                          ID,
                                                          LookupKey,
                                                          Coalesce(GovernanceID, Text(ID)),
                                                          DisplayText,
                                                          Coalesce(Title, GovernanceID, Text(ID)),
                                                          SecondaryText,
                                                          Coalesce(GovernanceID, ""),
                                                          IsActiveValue,
                                                          Coalesce(IsActive, true)
                                                      )
                                                  );
                                                  Collect(
                                                      colLoadedLookupTargets,
                                                      {
                                                          LookupObjectTypeKey: "System",
                                                          LoadedAt: Now()
                                                      }
                                                  )
                                              ),
                                              Blank()
                                          )
                                      );

                                      Set(gblEditorDirty, false);
                                      Set(gblEditorCanSave, CountRows(colEditorValues) > 0);
                                      Set(gblCurrentPage, "editor")
                                    Text: ="Neu"
                                    Visible: =gblCurrentPage <> "home" && gblCurrentPage <> "editor"
                                    Width: =80
                                    X: =lblRefresh.X - Self.Width - 12
                                    Y: =2
                              - galDashboardCards:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =Min(220, Parent.Height - 80)
                                    Items: =SortByColumns(colDashboardCards, "SortOrder", SortOrder.Ascending)
                                    OnSelect: =Set(gblCurrentPage, ThisItem.TargetPage)
                                    TemplatePadding: =8
                                    TemplateSize: =190
                                    Visible: =gblCurrentPage = "home"
                                    Width: =Parent.Width
                                    Y: =64
                                  Children:
                                    - lblDashboardValue:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorPrimary
                                          Fill: =gblTheme.ColorSurface
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =92
                                          OnSelect: =Select(Parent)
                                          Size: =28
                                          Text: =Text(ThisItem.Value)
                                          Width: =Parent.TemplateWidth - 16
                                          X: =8
                                          Y: =8
                                    - lblDashboardTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorText
                                          Fill: =gblTheme.ColorSurface
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =56
                                          OnSelect: =Select(Parent)
                                          Text: =ThisItem.Title
                                          Width: =Parent.TemplateWidth - 16
                                          X: =8
                                          Y: =100
                              - lblFrameworkIntro:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gblTheme.ColorTextMuted
                                    Font: =Font.'Open Sans'
                                    Height: =54
                                    Text: ="Das Framework lädt Navigation, Objekttypen, Formulare, Felder und Validierungen aus den zentralen SharePoint-Metadatenlisten."
                                    Visible: =gblCurrentPage = "home"
                                    Width: =Parent.Width
                                    Y: =292
                              - galObjectTypes:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =Parent.Height - 124
                                    Items: |-
                                      =Switch(
                                          gblCurrentNavigationKey,

                                          "NavGovernance",
                                          Filter(
                                              colObjectTypes,
                                              ObjectTypeKey in [
                                                  "Asset",
                                                  "System",
                                                  "Contact"
                                              ]
                                          ),

                                          "NavOperations",
                                          Filter(
                                              colObjectTypes,
                                              ObjectTypeKey in [
                                                  "Incident",
                                                  "Problem",
                                                  "Change"
                                              ]
                                          ),

                                          "NavRiskCompliance",
                                          Filter(
                                              colObjectTypes,
                                              ObjectTypeKey in [
                                                  "Risk",
                                                  "Control",
                                                  "Measure"
                                              ]
                                          ),

                                          FirstN(
                                              colObjectTypes,
                                              0
                                          )
                                      )
                                    OnSelect: |-
                                      =Set(gblSelectedObjectTypeKey, ThisItem.ObjectTypeKey);
                                      Set(gblObjectType, ThisItem.ObjectTypeKey);
                                      Set(gblSelectedRecordId, 0)
                                    TemplateFill: |-
                                      =If(
                                          ThisItem.ObjectTypeKey = gblSelectedObjectTypeKey,
                                          RGBA(230, 240, 250, 1),
                                          RGBA(0, 0, 0, 0)
                                      )
                                    TemplatePadding: =4
                                    TemplateSize: =72
                                    Visible: =gblCurrentPage = "ObjectList"
                                    Width: =Min(420, Parent.Width)
                                    Y: =64
                                  Children:
                                    - lblObjectTypeTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorText
                                          Fill: =If(ThisItem.ObjectTypeKey = gblObjectType, gblTheme.ColorSelected, gblTheme.ColorSurface)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =36
                                          OnSelect: =Select(Parent)
                                          PaddingLeft: =12
                                          Text: |-
                                            =Coalesce(
                                                ThisItem.PluralNameDE,
                                                ThisItem.Title,
                                                ThisItem.ObjectTypeKey
                                            )
                                          Width: =Parent.TemplateWidth
                                    - lblObjectTypeMeta:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorTextMuted
                                          Fill: =If(ThisItem.ObjectTypeKey = gblObjectType, gblTheme.ColorSelected, gblTheme.ColorSurface)
                                          Font: =Font.'Open Sans'
                                          Height: =28
                                          OnSelect: =Select(Parent)
                                          PaddingLeft: =12
                                          Size: =10
                                          Text: |-
                                            =ThisItem.ObjectTypeKey
                                                & " · "
                                                & Coalesce(
                                                    ThisItem.PluralNameDE,
                                                    ThisItem.Title
                                                )
                                                & " · "
                                                & CountRows(
                                                    Filter(
                                                        colFieldDefinitions,
                                                        ObjectTypeKey = ThisItem.ObjectTypeKey
                                                    )
                                                )
                                                & " Felder"
                                          Width: =Parent.TemplateWidth
                                          Y: =36
                              - galMetadata:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =Parent.Height - 124
                                    Items: |-
                                      =Switch(
                                          gblCurrentPage,

                                          "fields",
                                          ForAll(
                                              colFieldDefinitions,
                                              {
                                                  ItemKey: FieldDefinitionKey,
                                                  TitleText: Coalesce(DisplayNameDE, FieldInternalName, Title),
                                                  DetailText:
                                                      ObjectTypeKey
                                                      & " · "
                                                      & FieldInternalName
                                                      & " · "
                                                      & ControlType,
                                                  SourceType: "Field",
                                                  SourceId: ID
                                              }
                                          ),

                                          "forms",
                                          ForAll(
                                              colFormDefinitions,
                                              {
                                                  ItemKey: FormDefinitionKey,
                                                  TitleText: Coalesce(SectionTitleDE, FormDefinitionKey, Title),
                                                  DetailText:
                                                      ObjectTypeKey
                                                      & " · "
                                                      & FormMode
                                                      & " · "
                                                      & SectionKey,
                                                  SourceType: "Form",
                                                  SourceId: ID
                                              }
                                          ),

                                          "validation",
                                          ForAll(
                                              colValidationDefinitions,
                                              {
                                                  ItemKey: ValidationKey,
                                                  TitleText: Coalesce(MessageDE, ValidationKey, Title),
                                                  DetailText:
                                                      ObjectTypeKey
                                                      & " · "
                                                      & RuleType
                                                      & " · "
                                                      & Severity,
                                                  SourceType: "Validation",
                                                  SourceId: ID
                                              }
                                          ),

                                          "pages",
                                          ForAll(
                                              colPages,
                                              {
                                                  ItemKey: PageKey,
                                                  TitleText: Coalesce(DisplayNameDE, PageKey, Title),
                                                  DetailText:
                                                      PageKey
                                                      & " · "
                                                      & PageType
                                                      & " · "
                                                      & ScreenName,
                                                  SourceType: "Page",
                                                  SourceId: ID
                                              }
                                          ),

                                          Filter(
                                              Table(
                                                  {
                                                      ItemKey: "",
                                                      TitleText: "",
                                                      DetailText: "",
                                                      SourceType: "",
                                                      SourceId: 0
                                                  }
                                              ),
                                              ItemKey = "__never__"
                                          )
                                      )
                                    TemplatePadding: =4
                                    TemplateSize: =64
                                    Visible: |-
                                      =gblCurrentPage in [
                                          "fields",
                                          "forms",
                                          "validation",
                                          "pages"
                                      ]
                                    Width: =Parent.Width
                                    Y: =64
                                  Children:
                                    - lblMetadataTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorText
                                          Fill: =gblTheme.ColorSurface
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =32
                                          PaddingLeft: =12
                                          Text: =ThisItem.TitleText
                                          Width: =Parent.TemplateWidth
                                    - lblMetadataDetail:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorTextMuted
                                          Fill: =gblTheme.ColorSurface
                                          Font: =Font.'Open Sans'
                                          Height: =26
                                          PaddingLeft: =12
                                          Size: =10
                                          Text: =ThisItem.DetailText
                                          Width: =Parent.TemplateWidth
                                          Y: =32
                              - conEditor:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =gblTheme.ColorSurface
                                    Height: =Parent.Height - 72
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =gblCurrentPage = "editor"
                                    Width: =Parent.Width
                                    Y: =64
                                  Children:
                                    - lblEditorTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorText
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =42
                                          Size: =18
                                          Text: |-
                                            =If(
                                                gblEditorMode = "New",
                                                "Neues Objekt anlegen: " &
                                                Coalesce(
                                                LookUp(
                                                    colObjectTypes,
                                                    ObjectTypeKey = gblObjectType,
                                                    Title
                                                ),
                                                gblObjectType
                                            ),
                                                "Objekt bearbeiten"
                                            )
                                          Width: =Parent.Width - 160
                                          X: =16
                                          Y: =8
                                    - lblEditorCancel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =gblTheme.ColorBorder
                                          BorderThickness: =1
                                          Color: =gblTheme.ColorPrimary
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          OnSelect: |-
                                            =Clear(colEditorValues);
                                            Set(gblEditorDirty, false);
                                            Set(gblEditorCanSave, false);
                                            Set(gblCurrentPage, gblPreviousPage);
                                            Set(gblEditorMode, "");
                                            Set(gblObjectType, "");
                                            Set(gblSelectedRecordId, 0)
                                          Text: ="Abbrechen"
                                          Width: =100
                                          X: =Parent.Width - Self.Width - 16
                                          Y: =12
                                    - lblEditorSave:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =If(gblEditorCanSave, gblTheme.ColorPrimary, gblTheme.ColorBorder)
                                          BorderThickness: =1
                                          Color: =If(gblEditorCanSave, gblTheme.ColorTextInverse, gblTheme.ColorTextMuted)
                                          Fill: =If(gblEditorCanSave, gblTheme.ColorPrimary, gblTheme.ColorFooter)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =34
                                          OnSelect: |-
                                            =If(
                                                gblEditorCanSave && !gblSaveBusy,
                                                Set(gblSaveBusy, true);
                                                Set(gblSaveError, "");
                                                Set(gblSavedRecordId, 0);

                                                ClearCollect(
                                                    colSavePayload,
                                                    ForAll(
                                                        colEditorValues As editorValue,
                                                        {
