# ************************************************************************************************
Screens:
  scrShell:
    Properties:
      Fill: =gblTheme.ColorWorkspace
      LoadingSpinnerColor: =gblTheme.ColorPrimary
      OnVisible: =If(!gblInitialized, Set(gblBusy, true); Set(gblBusyMessage, "Initialisierung wird abgeschlossen …"))
    Children:
      - conRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conFooter:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblTheme.ColorFooter
                  Height: =gblTheme.FooterHeight
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                  Y: =Parent.Height - Self.Height
                Children:
                  - lblFooterStatus:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =If(gblDataError, gblTheme.ColorError, gblTheme.ColorTextMuted)
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        Size: =10
                        Text: =If(gblDataError, "Metadaten konnten nicht vollständig geladen werden", If(gblInitialized, "Bereit", "Initialisierung")) & " · " & gblEnvironment & " · " & gblAppVersion & " · " & Text(gblLastRefresh, "dd.mm.yyyy hh:mm")
                        Width: =Parent.Width - 32
                        X: =16
            - conBody:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblTheme.ColorWorkspace
                  Height: =Parent.Height - gblTheme.HeaderHeight - gblTheme.FooterHeight
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                  Y: =gblTheme.HeaderHeight
                Children:
                  - conWorkspace:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblTheme.ColorWorkspace
                        Height: =Parent.Height
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - conNavigation.Width
                        X: =conNavigation.Width
                      Children:
                        - conWorkspaceContent:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =gblTheme.ColorWorkspace
                              Height: =Parent.Height - (2 * gblTheme.ContentPadding)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width - (2 * gblTheme.ContentPadding)
                              X: =gblTheme.ContentPadding
                              Y: =gblTheme.ContentPadding
                            Children:
                              - lblPageTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Size: =24
                                    Text: |-
                                      =Coalesce(
                                          LookUp(
                                              colNavigation,
                                              NavKey = gblCurrentNavigationKey,
                                              Label
                                          ),
                                          "Governance Portal"
                                      )
                                    Width: =Parent.Width - 220
                              - lblRefresh:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    FocusedBorderColor: =gblTheme.ColorText
                                    FocusedBorderThickness: =3
                                    TabIndex: =0
                                    Align: =Align.Center
                                    BorderColor: =gblTheme.ColorBorder
                                    BorderThickness: =1
                                    Color: =gblTheme.ColorPrimary
                                    Fill: =gblTheme.ColorSurface
                                    DisplayMode: |-
                                      =If(gblShowDiscardDialog || gblSaveBusy || gblLoadBusy || gblCurrentPage = "editor", DisplayMode.Disabled, DisplayMode.Edit)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    OnSelect: |-
                                      =If(Self.DisplayMode = DisplayMode.Edit,
                                      IfError(
                                      Set(gblBusy, true);
                                      Set(gblBusyMessage, "Metadaten werden aktualisiert …");
                                      Refresh(PageDefinitions);
                                      Refresh(NavigationDefinitions);
                                      Refresh(ObjectTypes);
                                      Refresh(FormDefinitions);
                                      Refresh(FormFieldDefinitions);
                                      Refresh(FieldDefinitions);
                                      Refresh(ChoiceValues);
                                      Refresh(ValidationDefinitions);
                                      Set(gblLastRefresh, Now());
                                      Set(gblBusy, false);
                                      Set(gblBusyMessage, Blank());
                                      Switch(gblObjectType, "Asset", Refresh(Assets), "System", Refresh(Systems), "Change", Refresh(Changes));
                                      Set(gblRecordError, ""),
                                      Set(gblBusy, false); Set(gblBusyMessage, Blank()); Set(gblRecordError, "Aktualisierung fehlgeschlagen. " & FirstError.Message)
                                      )
                                      )
                                    Text: ="Aktualisieren"
                                    Width: =140
                                    X: =Parent.Width - Self.Width
                                    Y: =2
                              - lblNew:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    FocusedBorderColor: =gblTheme.ColorText
                                    FocusedBorderThickness: =3
                                    TabIndex: =0
                                    Align: =Align.Center
                                    BorderColor: =gblTheme.ColorPrimary
                                    BorderThickness: =1
                                    Color: =gblTheme.ColorTextInverse
                                    DisplayMode: |-
                                      =If(
                                          IsBlank(gblSelectedObjectTypeKey)
                                              || IsBlank(gblActiveProvider)
                                              || gblActiveProvider.ObjectTypeKey <> gblSelectedObjectTypeKey
                                              || !Coalesce(gblActiveProvider.SupportsCreate, false)
                                              || !Coalesce(gblActiveProvider.SupportsSave, false)
                                              || gblSaveBusy || gblLoadBusy || gblShowDiscardDialog || gblCurrentPage = "editor",
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    Fill: =gblTheme.ColorPrimary
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    OnSelect: |-
                                      =If(
                                          Self.DisplayMode = DisplayMode.Edit,
                                          Set(gblEditorMode, "New");
                                          Set(gblObjectType, gblSelectedObjectTypeKey);
                                          Set(gblSelectedRecordId, 0);
                                          Set(gblLoadedRecordId, 0);
                                          Set(gblEditorLoadComplete, false);
                                          Set(gblEditorConflict, false);
                                          Set(gblSaveError, "");
                                          Set(gblPreviousPage, gblCurrentPage);
                                          Set(gblLoadBusy, true);
                                          Clear(colRecordValues);
                                          Select(lblEditorInitialize)
                                      )
                                    Text: ="Neu"
                                    Visible: =gblCurrentPage <> "home" && gblCurrentPage <> "editor"
                                    Width: =80
                                    X: =lblRefresh.X - Self.Width - 12
                                    Y: =2
                              - galDashboardCards:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =Min(220, Parent.Height - 80)
                                    Items: =SortByColumns(colDashboardCards, "SortOrder", SortOrder.Ascending)
                                    OnSelect: =Set(gblCurrentPage, ThisItem.TargetPage)
                                    TemplatePadding: =8
                                    TemplateSize: =190
                                    Visible: =gblCurrentPage = "home"
                                    Width: =Parent.Width
                                    Y: =64
                                  Children:
                                    - lblDashboardValue:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorPrimary
                                          Fill: =gblTheme.ColorSurface
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =92
                                          OnSelect: =Select(Parent)
                                          Size: =28
                                          Text: =Text(ThisItem.Value)
                                          Width: =Parent.TemplateWidth - 16
                                          X: =8
                                          Y: =8
                                    - lblDashboardTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorText
                                          Fill: =gblTheme.ColorSurface
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =56
                                          OnSelect: =Select(Parent)
                                          Text: =ThisItem.Title
                                          Width: =Parent.TemplateWidth - 16
                                          X: =8
                                          Y: =100
                              - lblFrameworkIntro:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =gblTheme.ColorTextMuted
                                    Font: =Font.'Open Sans'
                                    Height: =54
                                    Text: ="Das Framework lädt Navigation, Objekttypen, Formulare, Felder und Validierungen aus den zentralen SharePoint-Metadatenlisten."
                                    Visible: =gblCurrentPage = "home"
                                    Width: =Parent.Width
                                    Y: =292
                              - galObjectTypes:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                                  Properties:
                                    AccessibleLabel: ="Objekttyp auswählen"
                                    ItemAccessibleLabel: =Coalesce(ThisItem.DisplayNameDE, ThisItem.Title, ThisItem.ObjectTypeKey)
                                    Selectable: =true
                                    TabIndex: =-1
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =If(Parent.Width >= 760, Parent.Height - 124, 168)
                                    Items: |-
                                      =Switch(
                                          gblCurrentNavigationKey,

                                          "NavGovernance",
                                          Filter(
                                              colObjectTypes,
                                              ObjectTypeKey in [
                                                  "Asset",
                                                  "System",
                                                  "Contact"
                                              ]
                                          ),

                                          "NavOperations",
                                          Filter(
                                              colObjectTypes,
                                              ObjectTypeKey in [
                                                  "Incident",
                                                  "Problem",
                                                  "Change"
                                              ]
                                          ),

                                          "NavRiskCompliance",
                                          Filter(
                                              colObjectTypes,
                                              ObjectTypeKey in [
                                                  "Risk",
                                                  "Control",
                                                  "Measure"
                                              ]
                                          ),

                                          FirstN(
                                              colObjectTypes,
                                              0
                                          )
                                      )
                                    OnSelect: |-
                                      =If(!gblSaveBusy && !gblLoadBusy && !gblShowDiscardDialog && !gblEditorDirty,
                                      Set(gblSelectedObjectTypeKey, ThisItem.ObjectTypeKey);
                                      Set(gblObjectType, ThisItem.ObjectTypeKey);
                                      Set(
                                          gblActiveProvider,
                                          LookUp(
                                              colObjectProviderRegistry,
                                              ObjectTypeKey = ThisItem.ObjectTypeKey
                                          )
                                      );
                                      Set(gblSelectedRecordId, 0);
                                      Set(gblRecordQuery, ""); Set(gblRecordQueryId, 0); Set(gblRecordError, "");
                                      Reset(txtRecordSearch); Reset(txtRecordId); Reset(galAssetRecords); Reset(galSystemRecords); Reset(galChangeRecords)
                                      )
                                    TemplateFill: |-
                                      =If(
                                          ThisItem.ObjectTypeKey = gblSelectedObjectTypeKey,
                                          RGBA(230, 240, 250, 1),
                                          RGBA(0, 0, 0, 0)
                                      )
                                    TemplatePadding: =4
                                    TemplateSize: =72
                                    Visible: =gblCurrentPage = "ObjectList"
                                    Width: =If(Parent.Width >= 760, 260, Parent.Width)
                                    Y: =64
                                  Children:
                                    - lblObjectTypeTitle:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          FocusedBorderColor: =gblTheme.ColorText
                                          FocusedBorderThickness: =3
                                          TabIndex: =0
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorText
                                          Fill: =If(ThisItem.ObjectTypeKey = gblObjectType, gblTheme.ColorSelected, gblTheme.ColorSurface)
                                          DisplayMode: =If(gblShowDiscardDialog || gblSaveBusy || gblLoadBusy, DisplayMode.Disabled, DisplayMode.Edit)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =36
                                          OnSelect: =Select(Parent)
                                          PaddingLeft: =12
                                          Text: |-
                                            =Coalesce(
                                                ThisItem.PluralNameDE,
                                                ThisItem.Title,
                                                ThisItem.ObjectTypeKey
                                            )
                                          Width: =Parent.TemplateWidth
                                    - lblObjectTypeMeta:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Color: =gblTheme.ColorTextMuted
                                          Fill: =If(ThisItem.ObjectTypeKey = gblObjectType, gblTheme.ColorSelected, gblTheme.ColorSurface)
                                          Font: =Font.'Open Sans'
                                          Height: =28
                                          OnSelect: =Select(Parent)
                                          PaddingLeft: =12
                                          Size: =10
                                          Text: |-
                                            =ThisItem.ObjectTypeKey
                                                & " · "
                                                & Coalesce(
                                                    ThisItem.PluralNameDE,
                                                    ThisItem.Title
                                                )
                                                & " · "
                                                & CountRows(
                                                    Filter(
                                                        colFieldDefinitions,
                                                        ObjectTypeKey = ThisItem.ObjectTypeKey
                                                    )
                                                )
                                                & " Felder"
                                          Width: =Parent.TemplateWidth
                                          Y: =36
                              - lblEditorInitialize:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =1
                                    Width: =1
                                    Visible: =false
                                    Text: =""
                                    OnSelect: |-
                                      =Set(gblPendingNavigationKey, "");
                                      Clear(colEditorValues);
                                          Clear(colEditorLookupSelections);
                                          Clear(colEditorPersonSelections);
                                          Clear(colEditorChoiceOptions);
                                          ForAll(
                                              SortByColumns(
                                                  Filter(
                                                      colFormFields As formField,
                                                      formField.ObjectTypeKey = gblSelectedObjectTypeKey && Switch(gblObjectType, "Asset", formField.FieldInternalName in ["Title", "AssetType", "Owner", "DeputyOwner", "BusinessOwner", "TechnicalOwner", "DataSteward", "Criticality", "DataClassification", "LifecycleStatus", "ConfidentialityRequirement", "IntegrityRequirement", "AvailabilityRequirement", "LastReviewDate", "NextReviewDate", "ReviewCycleMonths", "IsActive"], "System", formField.FieldInternalName in ["Title", "SystemDescription", "MonitoringStatus", "BackupStatus", "AuthenticationType", "SupportModel", "Owner", "GovernanceStatus", "Criticality", "SystemType", "Environment", "LastReviewDate", "NextReviewDate", "ReviewCycleMonths", "IsActive", "LinkedAsset"], "Change", formField.FieldInternalName in ["Title", "LinkedAsset", "IsActive", "Owner", "Approver", "ChangeType", "ChangeStatus", "ApprovalStatus", "ChangeRisk", "PlannedStart", "PlannedEnd", "ImplementationPlan", "RollbackPlan", "ActualEnd", "ApprovedDate", "EmergencyChange", "DowntimeExpected", "DowntimeMinutes", "RollbackValidated"], false)
                                                  ),
                                                  "SortOrder",
                                                  SortOrder.Ascending
                                              ) As formField,
                                              With(
                                                  {
                                                      fieldDefinition: LookUp(
                                                          colFieldDefinitions,
                                                          ObjectTypeKey = gblSelectedObjectTypeKey
                                                              && FieldInternalName = formField.FieldInternalName
                                                      )
                                                  },
                                                  Collect(
                                                      colEditorValues,
                                                      {
                                                          EditorFieldKey: gblSelectedObjectTypeKey & ":" & formField.FieldInternalName,
                                                          ObjectTypeKey: gblSelectedObjectTypeKey,
                                                          FieldInternalName: formField.FieldInternalName,
                                                          DisplayNameDE: Coalesce(
                                                              formField.OverrideLabelDE,
                                                              fieldDefinition.DisplayNameDE,
                                                              formField.FieldInternalName
                                                          ),
                                                          ControlType: Coalesce(
                                                              fieldDefinition.ControlType,
                                                              "Text"
                                                          ),
                                                          ChoiceSetKey: Coalesce(
                                                              fieldDefinition.ChoiceSetKey,
                                                              ""
                                                          ),
                                                          LookupObjectTypeKey: Coalesce(
                                                              fieldDefinition.LookupObjectTypeKey,
                                                              ""
                                                          ),
                                                          AllowMultiple: Coalesce(
                                                              fieldDefinition.AllowMultiple,
                                                              false
                                                          ),
                                                          SectionKey: Coalesce(
                                                              formField.SectionKey,
                                                              ""
                                                          ),
                                                          SortOrder: Coalesce(
                                                              formField.SortOrder,
                                                              0
                                                          ),
                                                          IsRequired: !IsBlank(formField.RequiredIf) || Coalesce(fieldDefinition.IsRequired, false),
                                                          IsReadOnly: false,
                                                          DefaultValue: Coalesce(fieldDefinition.DefaultValue, ""),
                                                          ValueText: If(
                                                              Coalesce(fieldDefinition.ControlType, "Text") in ["Text", "Note", "MultilineText"],
                                                              Coalesce(fieldDefinition.DefaultValue, ""),
                                                              ""
                                                          ),
                                                          ValueNumber: If(
                                                              Coalesce(fieldDefinition.ControlType, "") = "Number"
                                                                  && !IsBlank(fieldDefinition.DefaultValue),
                                                              Value(fieldDefinition.DefaultValue),
                                                              If(false, 0, Blank())
                                                          ),
                                                          ValueBoolean: If(
                                                              Coalesce(fieldDefinition.ControlType, "") = "Boolean",
                                                              Lower(Coalesce(fieldDefinition.DefaultValue, "false")) in ["true", "1", "ja", "yes"],
                                                              false
                                                          ),
                                                          ValueDate: If(
                                                              Coalesce(fieldDefinition.ControlType, "") in ["Date", "DateTime"]
                                                                  && !IsBlank(fieldDefinition.DefaultValue),
                                                              DateTimeValue(fieldDefinition.DefaultValue),
                                                              If(false, Now(), Blank())
                                                          ),
                                                          ValueChoiceKey: Coalesce(
                                                              LookUp(
                                                                  colChoiceValues As choiceValue,
                                                                  choiceValue.ChoiceSetKey = fieldDefinition.ChoiceSetKey
                                                                      && choiceValue.IsDefault = true,
                                                                  choiceValue.ChoiceKey
                                                              ),
                                                              fieldDefinition.DefaultValue,
                                                              ""
                                                          ),
                                                          ValueLookupId: If(false, 0, Blank()),
                                                          ValueLookupText: "",
                                                          ValuePersonEmail: "",
                                                          ValuePersonClaims: "",
                                                          ValuePersonDepartment: "",
                                                          ValuePersonJobTitle: "",
                                                          IsDirty: false,
                                                          IsValid: If(
                                                              !IsBlank(formField.RequiredIf) || Coalesce(fieldDefinition.IsRequired, false),
                                                              Switch(
                                                                  Coalesce(fieldDefinition.ControlType, "Text"),
                                                                  "Boolean", true,
                                                                  "Number", !IsBlank(fieldDefinition.DefaultValue),
                                                                  "Date", !IsBlank(fieldDefinition.DefaultValue),
                                                                  "DateTime", !IsBlank(fieldDefinition.DefaultValue),
                                                                  "Choice",
                                                                      !IsBlank(
                                                                          Coalesce(
                                                                              LookUp(
                                                                                  colChoiceValues As choiceValue,
                                                                                  choiceValue.ChoiceSetKey = fieldDefinition.ChoiceSetKey
                                                                                      && choiceValue.IsDefault = true,
                                                                                  choiceValue.ChoiceKey
                                                                              ),
                                                                              fieldDefinition.DefaultValue
                                                                          )
                                                                      ),
                                                                  !IsBlank(fieldDefinition.DefaultValue)
                                                              ),
                                                              true
                                                          ),
                                                          ErrorMessage: If(
                                                              (!IsBlank(formField.RequiredIf) || Coalesce(fieldDefinition.IsRequired, false))
                                                                  && IsBlank(fieldDefinition.DefaultValue)
                                                                  && Coalesce(fieldDefinition.ControlType, "Text") <> "Boolean",
                                                              "Pflichtfeld",
                                                              ""
                                                          )
                                                      }
                                                  )
                                              )
                                          );

                                          /*
                                              Stage 3.6: Choice Provider.
                                              Die Gallery-Control-Instanzen erhalten eine feldbezogene,
                                              stabile Optionsmenge mit eindeutigem EditorFieldKey.
                                          */
                                          Clear(colEditorChoiceOptions);
                                          ForAll(
                                              Filter(
                                                  colEditorValues,
                                                  ControlType = "Choice"
                                                      && !IsBlank(ChoiceSetKey)
                                              ) As choiceField,
                                              Collect(
                                                  colEditorChoiceOptions,
                                                  AddColumns(
                                                      ShowColumns(
                                                          Filter(
                                                              colChoiceValues As choiceValue,
                                                              choiceValue.ChoiceSetKey = choiceField.ChoiceSetKey
                                                                  && choiceValue.IsActive = true
                                                          ),
                                                          ChoiceSetKey,
                                                          ChoiceKey,
                                                          DisplayNameDE,
                                                          SortOrder,
                                                          IsDefault
                                                      ),
                                                      EditorFieldKey,
                                                      choiceField.EditorFieldKey
                                                  )
                                              )
                                          );

                                          /*
                                              Stage 3.3: Lookup Registry + Cache + Provider.

                                              Power Fx kann Datenquellen nicht dynamisch anhand eines
                                              Textwertes dereferenzieren. Die Registry beschreibt deshalb
                                              die verfügbaren Ziele; der Provider enthält je verbundener
                                              SharePoint-Liste einen statischen Zweig.

                                              Bereits geladene Ziele bleiben im Cache und werden beim
                                              erneuten Öffnen eines Editors nicht nochmals geladen.
                                          */
                                          ForAll(
                                              Distinct(
                                                  Filter(
                                                      colEditorValues,
                                                      ControlType = "Lookup"
                                                          && !IsBlank(LookupObjectTypeKey)
                                                  ),
                                                  LookupObjectTypeKey
                                              ) As requiredTarget,
                                              Switch(
                                                  requiredTarget.Value,
                                                  "Asset",
                                                  If(
                                                      IsBlank(
                                                          LookUp(
                                                              colLoadedLookupTargets,
                                                              LookupObjectTypeKey = "Asset"
                                                          )
                                                      ),
                                                      Collect(
                                                          colLookupValues,
                                                          AddColumns(
                                                              ShowColumns(
                                                                  Assets,
                                                                  ID,
                                                                  Title,
                                                                  GovernanceID,
                                                                  IsActive
                                                              ),
                                                              LookupObjectTypeKey,
                                                              "Asset",
                                                              LookupId,
                                                              ID,
                                                              LookupKey,
                                                              Coalesce(GovernanceID, Text(ID)),
                                                              DisplayText,
                                                              Coalesce(Title, GovernanceID, Text(ID)),
                                                              SecondaryText,
                                                              Coalesce(GovernanceID, ""),
                                                              IsActiveValue,
                                                              Coalesce(IsActive, true)
                                                          )
                                                      );
                                                      Collect(
                                                          colLoadedLookupTargets,
                                                          {
                                                              LookupObjectTypeKey: "Asset",
                                                              LoadedAt: Now()
                                                          }
                                                      )
                                                  ),
                                                  "System",
                                                  If(
                                                      IsBlank(
                                                          LookUp(
                                                              colLoadedLookupTargets,
                                                              LookupObjectTypeKey = "System"
                                                          )
                                                      ),
                                                      Collect(
                                                          colLookupValues,
                                                          AddColumns(
                                                              ShowColumns(
                                                                  Systems,
                                                                  ID,
                                                                  Title,
                                                                  GovernanceID,
                                                                  IsActive
                                                              ),
                                                              LookupObjectTypeKey,
                                                              "System",
                                                              LookupId,
                                                              ID,
                                                              LookupKey,
                                                              Coalesce(GovernanceID, Text(ID)),
                                                              DisplayText,
                                                              Coalesce(Title, GovernanceID, Text(ID)),
                                                              SecondaryText,
                                                              Coalesce(GovernanceID, ""),
                                                              IsActiveValue,
                                                              Coalesce(IsActive, true)
                                                          )
                                                      );
                                                      Collect(
                                                          colLoadedLookupTargets,
                                                          {
                                                              LookupObjectTypeKey: "System",
                                                              LoadedAt: Now()
                                                          }
                                                      )
                                                  ),
                                                  Blank()
                                              )
                                          );


                                      If(
                                          gblEditorMode = "Edit",
                                          ForAll(colRecordValues As loadedValue,
                                              With({editorInput: With(
                                          {editorField: LookUp(colEditorValues, FieldInternalName = loadedValue.FieldInternalName)},
                                          With(
                                              {loadedChoiceKey: If(IsBlank(loadedValue.ValueText), "", Coalesce(LookUp(colChoiceValues As choiceValue, choiceValue.ChoiceSetKey = editorField.ChoiceSetKey && choiceValue.DisplayNameDE = loadedValue.ValueText && choiceValue.IsActive, choiceValue.ChoiceKey), editorField.ChoiceSetKey & ":__unmapped__:" & loadedValue.ValueText))},
                                              {
                                                  ValueText: loadedValue.ValueText,
                                                  ValueNumber: loadedValue.ValueNumber,
                                                  ValueBoolean: loadedValue.ValueBoolean,
                                                  ValueDate: loadedValue.ValueDate,
                                                  ValueChoiceKey: If(editorField.ControlType = "Choice", loadedChoiceKey, ""),
                                                  ValueLookupId: loadedValue.ValueLookupId,
                                                  ValueLookupText: loadedValue.ValueLookupText,
                                                  ValuePersonEmail: loadedValue.ValuePersonEmail,
                                                  ValuePersonClaims: loadedValue.ValuePersonClaims,
                                                  ValuePersonDepartment: loadedValue.ValuePersonDepartment,
                                                  ValuePersonJobTitle: loadedValue.ValuePersonJobTitle,
                                                  IsDirty: false,
                                                  IsValid: !(editorField.ControlType = "Choice" && !IsBlank(loadedValue.ValueText) && ":__unmapped__:" in loadedChoiceKey) && (!editorField.IsRequired || Switch(editorField.ControlType,
                                                      "Text", !IsBlank(Trim(loadedValue.ValueText)), "Note", !IsBlank(loadedValue.ValueText),
                                                      "Number", !IsBlank(loadedValue.ValueNumber), "Boolean", !IsBlank(loadedValue.ValueBoolean),
                                                      "Date", !IsBlank(loadedValue.ValueDate), "DateTime", !IsBlank(loadedValue.ValueDate),
                                                      "Choice", !IsBlank(loadedChoiceKey), "Lookup", Coalesce(loadedValue.ValueLookupId, 0) > 0,
