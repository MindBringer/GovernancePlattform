Screens:
  scrDocumentApproval:
    Properties:
      Fill: =gblTheme.ColorWorkspace
      OnVisible: |-
        =UpdateContext({approvalSnapshot: Blank(), approvalBusy: false, approvalStatus: "",
            approvalReadOnly: gblAssetPilotEnabled && !gblAssetPilotCanWrite,
            approvalActions: Table(
                {Action: "save", Label: "Metadaten bearbeiten"},
                {Action: "submit", Label: "Zur Prüfung einreichen"},
                {Action: "approve", Label: "Fachlich freigeben"},
                {Action: "return", Label: "Als Entwurf zurückgeben"})});
          Reset(txtApprovalTitle);
          Reset(datApprovalReview);
          Reset(drpApprovalAction);
          Select(btnApprovalExecute)
    Children:
      - btnApprovalBack:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Zurück"
            DisplayMode: =If(approvalBusy, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =Back()
            Font: =Font.'Open Sans'
            Color: =gblTheme.ColorPrimary
            Fill: =gblTheme.ColorSurface
            FocusedBorderColor: =gblTheme.ColorText
            FocusedBorderThickness: =3
            Height: =44
            Width: =100
            X: =16
            Y: =16
      - lblApprovalTitle:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Dokumentfreigabe · " &
                  Coalesce(approvalSnapshot.title, approvalSnapshot.filename, approvalFileName) &
                  " · ID " & Text(approvalItemId)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Color: =gblTheme.ColorText
            Size: =19
            Height: =62
            Width: =Parent.Width - 32
            X: =16
            Y: =66
      - lblApprovalSummary:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(!IsBlank(approvalSnapshot.itemid),
                  approvalSnapshot.documentstatus & " · SharePoint-Version " & approvalSnapshot.nativeversion &
                  Char(10) & "Verantwortlich · " & Coalesce(approvalSnapshot.owner, "Unzugeordnet") &
                  " · Reviewtermin " &
                  If(IsBlank(approvalSnapshot.reviewdate), "Offen",
                      Text(DateValue(approvalSnapshot.reviewdate, "en-US"), "dd.mm.yyyy")) &
                  If(!IsBlank(approvalSnapshot.approvedby) && !IsBlank(approvalSnapshot.approveddate),
                      Char(10) & "Freigegeben · " & approvalSnapshot.approvedby & " · " &
                      Text(DateValue(approvalSnapshot.approveddate, "en-US"), "dd.mm.yyyy") &
                      " · geprüfte Version " & approvalSnapshot.approvedversion, ""))
            Font: =Font.'Open Sans'
            Color: =gblTheme.ColorText
            Height: =76
            Width: =Parent.Width - 32
            X: =16
            Y: =129
      - drpApprovalAction:
          Control: Classic/DropDown@2.3.1
          Properties:
            AccessibleLabel: ="Aktion zur Dokumentfreigabe"
            Items: |-
              =ShowColumns(Filter(approvalActions,
                  Switch(Action, "save", approvalSnapshot.canedit, "submit", approvalSnapshot.cansubmit,
                      "approve", approvalSnapshot.canapprove, "return", approvalSnapshot.canreturn, false)),
                  Label)
            Value: ="Label"
            Default: =""
            AllowEmptySelection: =true
            Visible: =approvalSnapshot.canedit || approvalSnapshot.cansubmit || approvalSnapshot.canapprove || approvalSnapshot.canreturn
            DisplayMode: =If(approvalBusy, DisplayMode.Disabled, DisplayMode.Edit)
            OnChange: |-
              =Reset(txtApprovalTitle);
                Reset(datApprovalReview)
            Font: =Font.'Open Sans'
            FocusedBorderColor: =gblTheme.ColorText
            FocusedBorderThickness: =3
            Height: =44
            Width: =Min(410, Parent.Width - 32)
            X: =16
            Y: =214
      - lblApprovalMetadata:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(IsBlank(approvalSnapshot.owner),
                  "Titel und Reviewtermin erfassen. Du übernimmst die Verantwortung für das Dokument.",
                  "Titel und Reviewtermin bearbeiten.")
            Visible: =drpApprovalAction.Visible && drpApprovalAction.Selected.Label = LookUp(approvalActions, Action = "save", Label)
            Font: =Font.'Open Sans'
            Color: =gblTheme.ColorText
            Height: =54
            Width: =Parent.Width - 32
            X: =16
            Y: =265
      - txtApprovalTitle:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: ="Dokumenttitel"
            HintText: ="Dokumenttitel"
            Default: =Coalesce(approvalSnapshot.title, approvalSnapshot.filename, "")
            Visible: =lblApprovalMetadata.Visible
            DisplayMode: =If(approvalBusy, DisplayMode.Disabled, DisplayMode.Edit)
            MaxLength: =255
            Font: =Font.'Open Sans'
            Height: =44
            Width: =Min(500, Parent.Width - 32)
            X: =16
            Y: =319
      - datApprovalReview:
          Control: Classic/DatePicker@2.6.0
          Properties:
            AccessibleLabel: ="Nächster Reviewtermin"
            DefaultDate: =If(IsBlank(approvalSnapshot.reviewdate), Blank(), DateValue(approvalSnapshot.reviewdate, "en-US"))
            InputTextPlaceholder: ="Reviewtermin auswählen"
            Visible: =lblApprovalMetadata.Visible
            DisplayMode: =If(approvalBusy, DisplayMode.Disabled, DisplayMode.Edit)
            Font: =Font.'Open Sans'
            Height: =44
            Width: =Min(300, Parent.Width - 32)
            X: =16
            Y: =373
      - btnApprovalExecute:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              =If(IsBlank(approvalSnapshot.revision), "Dokument laden",
                  Switch(LookUp(approvalActions, Label = drpApprovalAction.Selected.Label, Action),
                      "save", "Metadaten speichern", "submit", "Einreichen",
                      "approve", "Freigabe bestätigen", "return", "Zurückgeben", "Aktion ausführen"))
            Visible: =If(approvalReadOnly, IsBlank(approvalSnapshot.itemid), IsBlank(approvalSnapshot.revision) || drpApprovalAction.Visible)
            DisplayMode: |-
              =If(approvalBusy || approvalItemId <= 0 || !Self.Visible ||
                  (!IsBlank(approvalSnapshot.revision) &&
                      (IsBlank(drpApprovalAction.Selected.Label) || (lblApprovalMetadata.Visible &&
                          (IsBlank(Trim(txtApprovalTitle.Text)) || IsBlank(datApprovalReview.SelectedDate))))),
                  DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =If(Self.DisplayMode = DisplayMode.Edit,
                  If(approvalReadOnly,
                      UpdateContext({approvalBusy: true, approvalStatus: ""});
                      IfError(
                          With({doc: First(Switch(approvalKind,
                                  "Policy", ShowColumns(Filter(Policies, ID = approvalItemId), ID, Title,
                                      '{FilenameWithExtension}', '{VersionNumber}', DocumentStatus, DocumentOwner,
                                      DocumentReviewDate, ApprovedBy, ApprovedDate, DocumentVersion),
                                  "Procedure", ShowColumns(Filter(Procedures, ID = approvalItemId), ID, Title,
                                      '{FilenameWithExtension}', '{VersionNumber}', DocumentStatus, DocumentOwner,
                                      DocumentReviewDate, ApprovedBy, ApprovedDate, DocumentVersion),
                                  "Runbook", ShowColumns(Filter(Runbooks, ID = approvalItemId), ID, Title,
                                      '{FilenameWithExtension}', '{VersionNumber}', DocumentStatus, DocumentOwner,
                                      DocumentReviewDate, ApprovedBy, ApprovedDate, DocumentVersion)))},
                              If(doc.ID = approvalItemId,
                                  UpdateContext({approvalSnapshot: {
                                      status: "ready", itemid: doc.ID, kind: approvalKind,
                                      title: Coalesce(doc.Title, ""), filename: Coalesce(doc.'{FilenameWithExtension}', ""),
                                      owner: Coalesce(doc.DocumentOwner.DisplayName, ""), revision: "",
                                      reviewdate: If(IsBlank(doc.DocumentReviewDate), "",
                                          Text(doc.DocumentReviewDate, "yyyy-mm-dd", "en-US")),
                                      documentstatus: Coalesce(doc.DocumentStatus.Value, "Entwurf"),
                                      nativeversion: Coalesce(doc.'{VersionNumber}', ""),
                                      approvedversion: Coalesce(doc.DocumentVersion, ""),
                                      approvedby: Coalesce(doc.ApprovedBy.DisplayName, ""),
                                      approveddate: If(IsBlank(doc.ApprovedDate), "",
                                          Text(doc.ApprovedDate, "yyyy-mm-dd", "en-US")),
                                      canedit: false, cansubmit: false, canapprove: false, canreturn: false
                                  }}),
                                  UpdateContext({approvalStatus: "Das Dokument ist für dieses Konto nicht verfügbar."})
                              )
                          ),
                          UpdateContext({approvalStatus: "Dokument konnte nicht geladen werden."})
                      );
                      UpdateContext({approvalBusy: false}),
                      With({mode: If(IsBlank(approvalSnapshot.revision), "prepare",
                          LookUp(approvalActions, Label = drpApprovalAction.Selected.Label, Action))},
                      UpdateContext({approvalBusy: true, approvalStatus: ""});
                      IfError(
                          With({answer: GPDocumentApproval.Run(approvalItemId, approvalKind, mode,
                                  Coalesce(approvalSnapshot.revision, "-"), Coalesce(approvalSnapshot.nativeversion, "-"),
                                  If(mode = "save", Trim(txtApprovalTitle.Text), "-"),
                                  If(mode = "save", Text(datApprovalReview.SelectedDate, "yyyy-mm-dd", "en-US"), "-"))},
                              If(answer.itemid = approvalItemId && answer.kind = approvalKind &&
                                  answer.status = If(mode = "prepare", "ready", "saved") &&
                                  !IsBlank(answer.revision) && answer.revision <> "*" && !IsBlank(answer.nativeversion),
                                  UpdateContext({approvalSnapshot: answer, approvalStatus:
                                      Switch(mode, "save", "Metadaten gespeichert.", "submit", "Zur Prüfung eingereicht.",
                                          "approve", "Fachliche Freigabe gespeichert.", "return", "Als Entwurf zurückgegeben.", "")}),
                                  UpdateContext({approvalSnapshot: Blank(), approvalStatus:
                                      Switch(answer.status, "blocked", "Für diese Aktion fehlen Rechte oder der Dokumentstatus passt nicht.",
                                          "conflict", "Das Dokument wurde geändert. Lade den aktuellen Stand.",
                                          "invalid", "Die Eingaben sind ungültig. Lade das Dokument und prüfe den Reviewtermin.",
                                          "unavailable", "Das Dokument ist für dieses Konto nicht verfügbar.",
                                          "Ergebnis unklar. Lade den aktuellen Stand und prüfe den Versionsverlauf.")})
                              )
                          ),
                          UpdateContext({approvalSnapshot: Blank(), approvalStatus:
                              If(mode = "prepare", "Dokument konnte nicht geladen werden.",
                                  "Ergebnis unklar. Lade den aktuellen Stand und prüfe den Versionsverlauf.")})
                      );
                      Reset(drpApprovalAction);
                      Reset(txtApprovalTitle);
                      Reset(datApprovalReview);
                      UpdateContext({approvalBusy: false})
                      )
                  )
              )
            Font: =Font.'Open Sans'
            Color: =gblTheme.ColorTextInverse
            Fill: =gblTheme.ColorPrimary
            FocusedBorderColor: =gblTheme.ColorText
            FocusedBorderThickness: =3
            Height: =44
            Width: =Min(250, Parent.Width - 32)
            X: =16
            Y: =If(lblApprovalMetadata.Visible, 427, If(drpApprovalAction.Visible, 274, 214))
      - btnApprovalReload:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Neu laden"
            Visible: =!IsBlank(approvalSnapshot.itemid)
            DisplayMode: =If(approvalBusy, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =UpdateContext({approvalSnapshot: Blank(), approvalStatus: ""});
                Reset(drpApprovalAction);
                Select(btnApprovalExecute)
            Font: =Font.'Open Sans'
            Color: =gblTheme.ColorPrimary
            Fill: =gblTheme.ColorSurface
            FocusedBorderColor: =gblTheme.ColorText
            FocusedBorderThickness: =3
            Height: =44
            Width: =Min(130, (Parent.Width - 40) / 3)
            X: =Parent.Width - Self.Width - 16
            Y: =16
      - lblApprovalStatus:
          Control: Label@2.5.1
          Properties:
            Text: =If(approvalBusy, "Dokument wird geprüft …", approvalStatus)
            Live: =Live.Polite
            Font: =Font.'Open Sans'
            Color: =gblTheme.ColorText
            Height: =68
            Width: =Parent.Width - 32
            X: =16
            Y: =If(lblApprovalMetadata.Visible, 478, If(drpApprovalAction.Visible, 325, 267))
